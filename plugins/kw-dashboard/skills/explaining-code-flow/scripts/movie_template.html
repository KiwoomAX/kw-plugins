<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!-- render.py 가 제목과 흐름 데이터를 채운다(자리표시 문자열을 여기 다시 적으면 주석 안에도 데이터가 들어간다). 장면마다 자료(파일 · 질문 · 답)가 노드 사이를 움직이며 흐름을 보인다. -->
<style>
:root{
  --brand:#1A1A1A; --sel-weak:rgba(0,0,0,.034); --hover-weak:rgba(0,0,0,.014); --accent:#27457D;
  --bg-app:#FFFFFF; --bg-rail:#FAFAFA; --rail-tint:linear-gradient(180deg,#F1F5FB 0%,#FAFAFA 52%,#FAFAFA 100%);
  --bg-surface:#FFFFFF; --bg-sunken:#F4F4F5; --bg-hover:#F0F0F1;
  --text-primary:#1A1A1A; --text-secondary:#5D5D5D; --text-tertiary:#8E8E8E;
  --border-light:#E5E5E5; --border-medium:#D1D1D1;
  --radius-sm:6px; --radius-md:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#E6EAF0; --sel-weak:rgba(255,255,255,.07); --hover-weak:rgba(255,255,255,.04); --accent:#8FB0E6;
  --bg-app:#13171E; --bg-rail:#171C24; --rail-tint:none; --bg-surface:#1B212B; --bg-sunken:#222936; --bg-hover:#262E3B;
  --text-primary:#E6EAF0; --text-secondary:#B3BCCB; --text-tertiary:#8A94A6; --border-light:#2E3746; --border-medium:#3A4556; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#E6EAF0; --sel-weak:rgba(255,255,255,.07); --hover-weak:rgba(255,255,255,.04); --accent:#8FB0E6;
  --bg-app:#13171E; --bg-rail:#171C24; --rail-tint:none; --bg-surface:#1B212B; --bg-sunken:#222936; --bg-hover:#262E3B;
  --text-primary:#E6EAF0; --text-secondary:#B3BCCB; --text-tertiary:#8A94A6; --border-light:#2E3746; --border-medium:#3A4556; color-scheme:dark}
.stagewrap,.shot{--bg-surface:#FFFFFF; --bg-sunken:#F4F4F5; --text-primary:#1A1A1A; --text-secondary:#5D5D5D; --text-tertiary:#8E8E8E; --border-light:#E5E5E5; --border-medium:#D1D1D1; color-scheme:light; color:var(--text-primary)}
*{box-sizing:border-box}
body{margin:0;min-width:1120px;background:var(--bg-app);color:var(--text-primary);font:14px/1.7 'Pretendard',-apple-system,'Segoe UI','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh / var(--z, 1))}
.rail{background:var(--bg-rail);background-image:var(--rail-tint);border-right:1px solid var(--border-light);position:sticky;top:0;align-self:start;height:calc(100vh / var(--z, 1));display:flex;flex-direction:column}
.rail-head{height:68px;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px}
.rail-head .who{flex:1;min-width:0;display:flex;flex-direction:column;word-break:keep-all}
/* 여닫기 단추는 대시보드 템플릿의 사이드바와 같은 고스트 아이콘 단추다 */
.rail-toggle{width:30px;height:30px;flex:none;display:grid;place-items:center;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--text-tertiary);cursor:pointer}
.rail-toggle:hover{background:var(--hover-weak);color:var(--text-primary)}
.rail-head .co{font-size:12px;font-weight:600;color:var(--text-tertiary);line-height:1.35}
.rail-head .dv{font-size:16px;font-weight:600;color:var(--text-secondary);line-height:1.25}
.summary{color:var(--text-secondary);margin:-6px 0 12px;font-size:16px}
.rail-sec{font-size:12px;font-weight:600;color:var(--text-tertiary);padding:10px 18px 6px}
/* 기능을 펼치고 접으면 스크롤바가 생겼다 사라지며 목록 폭이 바뀌므로 스크롤바 칸을 늘 비워 둔다 */
.steps{padding:0 10px 16px;overflow:auto;scrollbar-gutter:stable;flex:1;min-height:0}
.steps::-webkit-scrollbar{width:10px}
.steps::-webkit-scrollbar-thumb{background:var(--border-light);border:3px solid var(--bg-rail);border-radius:999px}
.paren{display:block;font-size:14px;font-weight:600;color:var(--text-secondary)}
.rgrp{display:flex;gap:6px;align-items:baseline;width:100%;text-align:left;font:inherit;font-size:17px;font-weight:700;color:var(--text-primary);background:none;border:0;border-radius:var(--radius-sm);padding:6px 10px;margin-top:8px;cursor:pointer}
.rgrp:hover{background:var(--hover-weak)}
.rgrp .chev{color:var(--text-tertiary);font-size:12px;min-width:12px}
/* 접으면 여닫기 단추만 남은 64px 사이드바가 된다 */
.app.folded{grid-template-columns:64px 1fr} .app.folded .nav{left:64px}
.app.folded .rail-head{justify-content:center;padding:0} .app.folded .rail-head .who,.app.folded .steps{display:none}
.step{display:flex;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);color:var(--text-secondary);cursor:pointer;font-size:15px;line-height:1.45}
.step:hover{background:var(--hover-weak);color:var(--text-primary)}
.step.on{color:var(--brand);font-weight:700;background:var(--sel-weak)}
.step .no{color:var(--text-tertiary);min-width:18px}
.top{position:sticky;top:0;z-index:5;height:56px;display:flex;align-items:center;gap:18px;padding:0 32px;background:var(--bg-app);border-bottom:1px solid var(--border-light)}
.top h1{margin:0;font-size:17px;font-weight:700}
.top .repo{margin-left:auto;font-size:12px;color:var(--text-tertiary)}
.content{padding:20px 32px 96px}
.kicker{font-size:14px;color:var(--text-tertiary);font-weight:600}
.content h2{margin:2px 0 12px;font-size:26px;letter-spacing:-.02em}
.body{display:grid;grid-template-columns:minmax(0,var(--lf,3fr)) 12px minmax(300px,var(--rf,2fr));gap:12px;align-items:start}
/* 흐름 칸과 화면 칸 사이 구분선. 끌면 두 칸의 폭 비율이 바뀐다 */
.split{align-self:stretch;cursor:col-resize;position:relative;min-height:200px}
.split::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;border-radius:2px;background:var(--border-light)}
.split:hover::before,.split.drag::before{background:#27457D}
.body[hidden]{display:none}
/* 무대: 노드는 고정 위치, 자료 아이콘이 그 사이를 움직인다. 창이 좁으면 무대 전체를 비율로 줄여 오른쪽 칸을 남긴다 */
.stagewrap{width:100%;overflow:hidden}
.stage{transform-origin:0 0;position:relative;width:960px;height:460px;border:1px solid var(--border-light);border-radius:var(--radius-md);background:var(--bg-surface);overflow:hidden}
.group{position:absolute;border:1.5px dashed var(--zc);border-radius:14px;background:var(--zb)}
.group .gname{position:absolute;left:10px;top:-13px;white-space:nowrap;display:flex;align-items:center;gap:5px;padding:2px 8px 2px 4px;font-size:12px;font-weight:700;color:var(--zc);background:#fff;border:1.5px solid var(--zc);border-radius:999px}
.group .gname svg{width:16px;height:16px;padding:2px;border-radius:50%;background:var(--zc)}
.node{position:absolute;width:172px;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;text-align:left;padding:9px 12px;
      border:1.5px solid var(--kc);border-radius:12px;background:var(--kb);transition:box-shadow .3s}
.node .ki{flex:none;width:30px;height:30px;border-radius:8px;background:var(--kc);display:grid;place-items:center}
.node .ki svg{width:18px;height:18px}
.node .kt{min-width:0}
.node b{display:block;font-size:13.5px;line-height:1.3}
.node span{display:block;font-size:11px;color:var(--text-secondary);line-height:1.35}
.node .kk{display:block;font-size:10px;font-weight:700;color:var(--text-tertiary);line-height:1.2}
.node .ki{background:#5B6C8C}
.node.hot{box-shadow:0 0 0 4px var(--kr)}
.kinds{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px;color:var(--text-secondary)}
.kinds i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.node.ping{animation:ping .6s ease}
@keyframes ping{40%{transform:translate(-50%,-50%) scale(1.06)}}
svg.wires{position:absolute;inset:0;pointer-events:none}
.token{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:999px;background:#fff;border:1.5px solid;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:3}
.token svg{width:20px;height:20px;flex:none}
.token.pack{flex-wrap:wrap;max-width:260px;border-radius:12px;padding:6px 10px 7px 6px}
.token .items{flex-basis:100%;display:flex;flex-wrap:wrap;gap:3px;padding-left:26px}
.token .items em{font-style:normal;font-size:11px;font-weight:600;color:#1A1A1A;background:#F1F3F7;border-radius:999px;padding:0 7px}
.sub{margin-top:6px;min-height:20px;font-size:14px;color:var(--text-tertiary)}
/* 무대 아래 진행 목록: 지금 동작을 굵게 · 회색 면으로 표시한다 */
.steps-now{margin-top:10px}
.steps-now h4{margin:0 0 8px;font-size:14px;color:var(--text-tertiary);font-weight:700}
.steps-now ol{margin:0;padding:0;list-style:none;counter-reset:st;font-size:17px;line-height:1.55}
.steps-now li{counter-increment:st;display:flex;gap:8px;margin-bottom:3px;padding:3px 10px;color:var(--text-tertiary);cursor:pointer;border-radius:8px}
.steps-now li::before{content:counter(st) ".";flex:none;min-width:22px;text-align:right}
.steps-now li:hover{background:var(--bg-hover)}
.steps-now li.done{color:var(--text-secondary)}
.steps-now li.now{color:var(--text-primary);font-weight:700;background:#EEF0F3}
/* 오른쪽 알아 둘 점: 화면을 쓰는 사람에게 가장 중요한 내용이라 크게 · 진하게 보인다 */
.tips{border:1.5px solid #27457D;background:#F5F8FD;padding:14px 16px;border-radius:var(--radius-md);font-size:15.5px;line-height:1.6}
.tips b{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:16px;color:#27457D}
.tips b::before{content:"!";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#27457D;color:#fff;font-size:13px}
.tips ul{margin:0;padding-left:20px}
.log .tips li{margin-bottom:8px;color:#0F1E3D;cursor:default;font-weight:500;border:0;padding:0}
.tips li:last-child{margin-bottom:0}
.log .tips li:hover{background:none}
/* 핵심은 크게 모두 보이고, 참고는 접어 둔다. 되돌릴 수 없는 핵심은 아래에 작은 주황 글씨를 붙인다 */
.log .tips ul.core li{font-size:17px;line-height:1.5}
.tips .irr{display:block;margin-top:2px;font-size:13px;font-weight:600;color:#C2410C}
.log .tips li.defect{list-style:none;margin-left:-20px;border:1.5px solid #B42318;background:#FCE9E7;border-radius:6px;padding:8px 10px}
.tips li.defect em{font-style:normal;font-weight:700;color:#B42318;margin-right:6px}
.tips details.ref{margin-top:10px}
.tips details.ref summary{cursor:pointer;font-size:13px;font-weight:600;color:#27457D}
.tips details.ref ul{margin-top:6px}
.log .tips details.ref li{font-size:14px;color:#4A5565;font-weight:400}
.prereq{margin:-4px 0 14px;border:1px solid #C2410C;background:#FDEEE4;border-radius:var(--radius-md);padding:10px 14px;font-size:15px;color:#3A2410}
.prereq b{color:#C2410C;margin-right:8px}
.autob{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:4px;background:#EEF0F3;color:#5B6C8C;font-size:12px;font-weight:700;vertical-align:2px}
/* 오른쪽 칸(화면 캡처 · 알아 둘 점)은 아래 진행 목록을 읽으며 내려가도 상단 막대 아래에 붙어 따라온다 */
/* 오른쪽 칸: 캡처는 위에 고정하고 알아 둘 점만 칸 안에서 스크롤한다. 구분선으로 칸을 넓혀 캡처가 커져도 캡처가 밀려 올라가지 않는다 */
.log{font-size:13px;position:sticky;top:72px;align-self:start;max-height:calc(100vh / var(--z, 1) - 160px);display:flex;flex-direction:column;overflow:hidden}
.log .shot{flex:none}
.log .tips{min-height:0;overflow:auto;scrollbar-gutter:stable}
/* 왼쪽 칸: 흐름 그림은 위에 고정하고, 그 아래 진행 목록만 페이지와 함께 스크롤한다 */
.stagewrap{position:sticky;top:72px;z-index:2}
/* 외부 프로그램 · 시스템이 처음 쓰일 때 창이 열리는 동작 */
.node.opened{border-color:#27457D;border-style:solid}
.launchwin{position:absolute;z-index:4;width:64px;height:46px;border:2px solid #27457D;border-radius:6px;background:#fff;
  transform:translate(-50%,-50%);box-shadow:0 6px 18px rgba(0,0,0,.18);pointer-events:none}
.launchwin::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:#27457D}
.launchwin::after{content:"";position:absolute;left:8px;right:8px;top:18px;height:4px;border-radius:2px;background:#C9D3E3;box-shadow:0 9px 0 #C9D3E3,0 18px 0 #E3E8F0}
/* 검색창에 글자를 치는 연출 */
.shot .mark .typed{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-weight:700;color:#1A1A1A;background:#fff;padding:0 2px;white-space:nowrap}
.shot .mark .typed::after{content:"";display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-.15em;background:#27457D;animation:caret .8s step-end infinite}
@keyframes caret{50%{opacity:0}}
/* 실제 대시보드 화면 창: 장면 시작에는 누르는 곳, 결과가 돌아오면 결과가 나타나는 곳을 확대해 보인다 */
.shot{margin-bottom:16px;border:1px solid var(--border-medium);border-radius:var(--radius-md);overflow:hidden;background:#fff}
.shot .cap{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:12px;font-weight:700;border-bottom:1px solid var(--border-light)}
.shot .cap i{width:8px;height:8px;border-radius:50%}
/* 캡처는 백엔드 없이 가짜 데이터로 띄운 화면이라, 실제 값으로 오해하지 않도록 화면 아래에 늘 밝힌다 */
.shot .ex{padding:5px 10px;font-size:12px;color:var(--text-tertiary);border-top:1px solid var(--border-light)}
.shot .view{position:relative;width:100%;aspect-ratio:var(--shot-ratio);max-height:560px;overflow:hidden;background:#F4F4F5}
.shot .view img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0}
.shot .mark{position:absolute;border:3px solid;border-radius:6px;box-shadow:0 0 0 2000px rgba(0,0,0,.18)}
.shot .wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-secondary);font-size:15px;text-align:center;padding:0 16px}
.log h4{margin:0 0 6px;font-size:12px;color:var(--text-tertiary);font-weight:600}
.log ol{margin:0;padding-left:20px}
.log li{margin-bottom:8px;color:var(--text-tertiary)}
.log li.done{color:var(--text-secondary)}
.log li.now{color:var(--text-primary);font-weight:700}
.log li{cursor:pointer;border-radius:6px} .log li:hover{background:var(--bg-hover)}
.nav{position:fixed;left:320px;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:8px;padding:12px 32px;background:var(--bg-app);border-top:1px solid var(--border-light)}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--border-medium);background:var(--bg-surface);border-radius:var(--radius-sm);padding:8px 14px;cursor:pointer;color:var(--text-primary)}
.btn:hover{background:var(--bg-hover)} .btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--brand);color:var(--bg-app);border-color:var(--brand)}
/* 영상 재생기처럼 아이콘만 있는 단추. 아이콘은 글자색을 따른다 */
.btn.ib{width:38px;height:36px;padding:0;display:inline-grid;place-items:center}
.btn svg{width:15px;height:15px;fill:currentColor;display:block}
.btn .ic{display:inline-block;vertical-align:-2px;margin-right:6px} .btn .ic svg{width:12px;height:12px}
.ctl{display:inline-flex;gap:4px}
.nav .pg{margin-left:auto;font-size:12px;color:var(--text-tertiary)}
.speed{display:flex;align-items:center;gap:8px;margin-left:16px;font-size:12px;color:var(--text-secondary)}
.speed input{width:140px;accent-color:var(--accent)}
.speed b{min-width:40px;color:var(--text-primary)}
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="rail-head"><div class="who"><span class="co">동작 흐름 · 움직이며 보기</span><span class="dv" id="railTitle"></span></div>
      <button class="rail-toggle" id="fold" type="button"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button></div>
    <div class="steps" id="steps"></div>
  </nav>
  <div>
    <header class="top"><h1 id="title"></h1><span class="repo" id="repo"></span></header>
    <main class="content">
      <div class="kicker" id="kicker"></div><h2 id="sceneTitle"></h2><p class="summary" id="summary"></p><div class="prereq" id="prereq" hidden></div>
      <div class="body">
        <div><div class="stagewrap" id="stagewrap"><div class="stage" id="stage"></div></div><div class="kinds" id="kinds"></div>
          <div class="steps-now"><h4>이 장면에서 일어나는 일 · 번호를 누르면 그 동작만 봅니다</h4><ol id="log"></ol><div class="sub" id="sub"></div></div></div>
        <div class="split" id="split" title="끌어서 왼쪽 · 오른쪽 폭을 조절합니다"></div>
        <div class="log"><div class="shot" id="shot" hidden></div><div class="tips" id="tips" hidden></div></div>
      </div>
    </main>
    <div class="nav">
      <button class="btn primary" id="all" type="button"><span class="ic" id="allIc"></span>기능 재생</button>
      <span class="ctl">
        <button class="btn ib" id="prevScene" type="button" title="이전 장면 (←)" aria-label="이전 장면"><svg viewBox="0 0 24 24"><path d="M11 6 3 12l8 6zM21 6l-8 6 8 6z"/></svg></button>
        <button class="btn ib" id="part" type="button" title="이 부분 다시 재생" aria-label="이 부분 다시 재생"><svg viewBox="0 0 24 24"><path d="M17 5 7 12l10 7z"/></svg></button>
        <button class="btn ib" id="pp" type="button"></button>
        <button class="btn ib" id="nextScene" type="button" title="다음 장면 (→)" aria-label="다음 장면"><svg viewBox="0 0 24 24"><path d="M3 6l8 6-8 6zM13 6l8 6-8 6z"/></svg></button>
      </span>
      <button class="btn" id="replay" type="button">이 장면 다시 보기</button>
      <label class="speed">재생 속도 <input type="range" id="speed" min="1" max="2.5" step="0.25" value="1.5"><b id="speedVal">1.5배</b></label>
      <span class="pg" id="pg"></span><button class="btn" id="theme" type="button"></button>
    </div>
  </div>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
// 기능이 여럿이면 D.features, 하나면 D 자체가 기능 하나다. 노드의 종류 · 구역 · 좌표는 JSON 이 적는다.

const zoneOf = n => n.zone;
let F, NODE, fi = 0;
function useFeature(k) {
  fi = k; F = FEATURES[k];
  // 좌표는 높이 520 기준으로 적혀 있다. 아래 진행 목록이 한 화면에 들어오도록 무대를 460 으로 줄이고 세로 좌표를 줄인다
  if (!F.scaled) { F.scaled = true;
    F.nodes = F.nodes.map(n => ({...n, y: Math.round(30 + (n.y - 30) * 0.86)})); }
  NODE = new Map(F.nodes.map(n => [n.id, n]));
}
// 구역 상자는 그려진 노드의 실제 크기로 감싼다. 노드 글자가 줄바꿈되어 높아져도 상자가 노드를 다 덮고,
// 위쪽에는 구역 이름이 노드를 가리지 않도록 여백을 둔다
function zoneBoxes() {
  const by = {}, half = n => { const el = document.getElementById('n-' + n.id); return [el.offsetWidth / 2, el.offsetHeight / 2]; };
  F.nodes.forEach(n => { const z = zoneOf(n); if (z) (by[z] = by[z] || []).push(n); });
  return Object.entries(by).map(([z, ns]) => {
    const x1 = Math.min(...ns.map(n => n.x - half(n)[0])) - 14, x2 = Math.max(...ns.map(n => n.x + half(n)[0])) + 14;
    const y1 = Math.min(...ns.map(n => n.y - half(n)[1])) - 26, y2 = Math.max(...ns.map(n => n.y + half(n)[1])) + 14;
    const L = Math.max(6, x1), T = Math.max(14, y1);
    return {z, x: L, y: T, w: Math.min(954, x2) - L, h: Math.min(454, y2) - T};
  });
}

// 재생이 다른 기능으로 넘어가면 그 기능만 펼친다. 다른 기능의 장면을 누르면 그 기능으로 바꿔 재생한다
const open = new Set();

// 이름 끝의 괄호 설명은 다음 줄에 작게 보인다. 예: 「팀 상세 대시보드」 아래 줄에 「(홀세일1팀 · 홀세일2팀)」
function nameHtml(n) {
  const m = /^(.+?)\s*(\([^()]*\))$/.exec(n);
  return m ? `${esc(m[1])}<span class="paren">${esc(m[2])}</span>` : esc(n);
}
function showOpen() {
  document.querySelectorAll('.rgrp').forEach(el => {
    const o = open.has(+el.dataset.g);
    el.setAttribute('aria-expanded', o); el.querySelector('.chev').textContent = o ? '▾' : '▸';
  });
  document.querySelectorAll('.rbody').forEach(el => el.hidden = !!D.features && !open.has(+el.dataset.g));
}
function drawRail() {
  document.getElementById('railTitle').textContent = D.title;
  document.getElementById('steps').innerHTML = FEATURES.map((f, k) =>
    (D.features ? `<button class="rgrp" type="button" data-g="${k}"><span class="chev"></span><span>${k + 1}. ${nameHtml(f.name)}</span></button>` : '') +
    `<div class="rbody" data-g="${k}">` + f.scenes.map((s, i) =>
      `<div class="step" data-f="${k}" data-i="${i}"><span class="no">${i + 1}</span><span>${esc(s.title)}${s.auto ? '<span class="autob">자동</span>' : ''}</span></div>`).join('') + '</div>').join('');
  // 다른 기능을 펼치면 그 기능의 장면 1로 넘어간다. 지금 기능을 여닫거나 다른 기능을 접을 때는 목록만 바뀐다
  document.querySelectorAll('.rgrp').forEach(el => el.onclick = () => {
    const g = +el.dataset.g;
    if (!open.has(g) && g !== fi) { useFeature(g); return play(0); }
    open.has(g) ? open.delete(g) : open.add(g); showOpen();
  });
  document.querySelectorAll('.step').forEach(el => el.onclick = () => {
    if (+el.dataset.f !== fi) useFeature(+el.dataset.f);
    play(+el.dataset.i, auto);
  });
  showOpen();
}
function openCurrent() {
  if (openedFor === fi) return;
  openedFor = fi; open.clear(); open.add(fi); showOpen();
}

const kindOf = n => n.kind;
function nodeHtml(n) {
  const k = KIND[kindOf(n)];
  // 구역 상자 안의 노드는 구역 이름에 아이콘이 있으므로 아이콘을 빼고 종류 이름과 색만 둔다
  // 정해진 시각 자동 실행은 사람이 시작하지 않는다는 점이 중요해서 구역 안에서도 시계 아이콘을 둔다
  const icon = zoneOf(n) && !k.keepIcon ? '' : `<div class="ki"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${k.i}</svg></div>`;
  // 상자는 회색 테두리 하나로 두고, 색은 구역 상자만 쓴다. 지금 움직이는 상자는 구역 색으로 강조한다
  const z = ZONE[zoneOf(n)], hot = z ? z.c : '#27457D';
  return `<div class="node" id="n-${n.id}" style="left:${n.x}px;top:${n.y}px;--kc:#B8BEC6;--kb:#fff;--kr:${hot}2B">` + icon +
    `<div class="kt"><span class="kk">${k.label}</span><b>${esc(n.name)}</b><span>${esc(n.sub || '')}</span></div></div>`;
}

// 무대를 무대 칸 폭에 맞춰 줄이거나 키운다. 무대 안 좌표는 그대로 두므로 움직임 계산은 바뀌지 않는다
function fitStage() {
  const wrap = document.getElementById('stagewrap'), s = wrap.clientWidth / 960;
  document.getElementById('stage').style.transform = `scale(${s})`;
  wrap.style.height = Math.ceil(462 * s) + 'px';
}
// 화면 전체 배율: 창 폭 1920 에서 0.8 배가 되도록 창 폭에 맞춘다.
// 좁은 노트북에서 글자가 너무 작아지지 않게 0.6 배 아래로는 줄이지 않고, 아주 넓은 화면에서는 1 배를 넘기지 않는다
function fitPage() {
  const z = Math.max(0.6, Math.min(1, window.innerWidth / 2400));
  document.documentElement.style.zoom = z;
  document.documentElement.style.setProperty('--z', z);
}
fitPage();
window.addEventListener('resize', () => { fitPage(); fitStage(); });
// 구분선을 끌면 흐름 칸의 폭 비율(30 ~ 80%)이 바뀌고, 고른 비율은 이 브라우저에 기억해 둔다
(() => {
  const sp = document.getElementById('split'), body = document.querySelector('.body');
  const set = f => {
    f = Math.min(0.8, Math.max(0.3, f));
    body.style.setProperty('--lf', f + 'fr'); body.style.setProperty('--rf', (1 - f) + 'fr');
    fitStage();
    return f;
  };
  try { const f = +localStorage.getItem('flow-split'); if (f) set(f); } catch (e) {}
  sp.onmousedown = e => {
    e.preventDefault();
    sp.classList.add('drag');
    let f;
    const move = ev => { const r = body.getBoundingClientRect(); f = set((ev.clientX - r.left) / r.width); };
    const up = () => {
      sp.classList.remove('drag');
      removeEventListener('mousemove', move); removeEventListener('mouseup', up);
      try { if (f) localStorage.setItem('flow-split', f); } catch (e) {}
    };
    addEventListener('mousemove', move); addEventListener('mouseup', up);
  };
})();
function drawStage() {
  const st = document.getElementById('stage');
  st.innerHTML = '<svg class="wires" id="wires" width="960" height="460"></svg>' + F.nodes.map(n => nodeHtml(n)).join('');
  st.insertAdjacentHTML('afterbegin', zoneBoxes().map(g => `<div class="group" style="left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px;--zc:${ZONE[g.z].c};--zb:${ZONE[g.z].b}"><span class="gname"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ZONE[g.z].i}</svg>${esc((F.zoneNames || {})[g.z] || ZONE[g.z].name)}</span></div>`).join(''));
  // 구역 이름이 상자보다 길면 상자를 넓힌다. 무대 오른쪽을 넘으면 왼쪽으로 옮긴다
  st.querySelectorAll('.group').forEach(g => {
    const need = g.querySelector('.gname').offsetWidth + 24;
    if (need <= g.offsetWidth) return;
    const left = Math.max(6, Math.min(g.offsetLeft, 954 - need));
    g.style.left = left + 'px'; g.style.width = need + 'px';
  });
  document.getElementById('kinds').innerHTML = '';
  fitStage();
}

// 재생 속도: 모든 이동 · 멈춤 시간을 이 배수로 나눈다. 바꾸면 진행 중인 움직임에도 바로 적용된다
// 재생 속도는 1 ~ 2.5 배이고 기본은 1.5 배다. 1 배가 원래 속도다. 기억된 값이 이 범위 밖이면 기본으로 돌아간다.
// 기본을 바꾼 뒤에도 예전에 고른 2 배가 남지 않게 저장 키를 새로 쓴다
let SPEED = 1.5;
try { const v = +localStorage.getItem('flow-speed-v2'); if (v >= 1 && v <= 2.5) SPEED = v; } catch (e) {}
const T = ms => ms / SPEED;
// 정지는 재생을 취소하지 않고, 남은 대기 시간과 진행 중인 애니메이션을 그 자리에 멈춘다. 다시 재생하면 남은 시간부터 이어 간다.
// busy 는 장면을 재생하는 중(멈춘 상태 포함)인지, paused 는 멈춰 있는지다
let busy = false, paused = false, held = [];
const timers = new Set();
const waitRaw = ms => new Promise(r => {
  const t = {left: ms};
  t.go = () => { t.t0 = performance.now(); t.id = setTimeout(() => { timers.delete(t); r(); }, t.left); };
  t.hold = () => { clearTimeout(t.id); t.left -= performance.now() - t.t0; };
  timers.add(t);
  if (!paused) t.go();
});
const wait = ms => waitRaw(T(ms));
function setPaused(p) {
  if (p === paused) return;
  paused = p;
  timers.forEach(t => p ? t.hold() : t.go());
  // 끝난 애니메이션을 다시 틀지 않도록, 멈출 때 돌던 것만 기억했다가 그것만 다시 튼다
  if (p) { held = document.getAnimations().filter(a => a.playState === 'running'); held.forEach(a => a.pause()); }
  else { held.forEach(a => a.play()); held = []; }
  showPlay();
}
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
function showPlay() {
  const on = busy && !paused, pp = document.getElementById('pp');
  pp.innerHTML = on ? ICON_PAUSE : ICON_PLAY;
  pp.title = (on ? '정지' : '재생') + ' (스페이스)'; pp.setAttribute('aria-label', on ? '정지' : '재생');
  document.getElementById('allIc').innerHTML = on && auto ? ICON_PAUSE : ICON_PLAY;
}
function finish(my) { if (my === run) { busy = false; showPlay(); } }
(() => {
  const el = document.getElementById('speed'), out = document.getElementById('speedVal');
  const show = () => out.textContent = (Number.isInteger(SPEED) ? SPEED : SPEED.toFixed(2).replace(/0$/, '')) + '배';
  el.value = SPEED; show();
  el.oninput = () => {
    SPEED = +el.value; show();
    document.getAnimations().forEach(a => a.playbackRate = SPEED);
    try { localStorage.setItem('flow-speed-v2', SPEED); } catch (e) {}
  };
})();

// auto 가 참이면 장면이 끝난 뒤 다음 장면을 이어서 재생한다(기능 재생). 기능 재생 중에 이전 · 다음 장면이나
// 장면 목록을 눌러도 그 장면으로 옮겨 가서 이어서 재생하고, 기능의 마지막 장면이 끝나거나 다른 기능을 고를 때 끝난다
let auto = false;
function setAuto(on) { auto = on; showPlay(); }
// 화면 창: 실제 대시보드 캡처 위를 카메라처럼 움직인다. rect 는 캡처 안의 [x, y, 폭, 높이]다.
// 장면 시작에는 전체 화면에서 누를 곳으로 확대하고, 뒤에서 동작이 이어지는 동안 전체로 줌아웃했다가,
// 결과가 돌아오는 마지막 동작에서 결과가 나타나는 곳으로 확대한다.
// 캡처 크기는 render.py 가 capture.py 의 값을 데이터의 shot 으로 넣어 준다
const [SHOT_W, SHOT_H] = D.shot;
document.documentElement.style.setProperty('--shot-ratio', `${SHOT_W} / ${SHOT_H}`);
// cont 가 참이면 앞 장면의 결과 화면이 이 장면의 시작 화면과 같아, 전체 화면으로 돌아가지 않고 앞 장면이 끝난 위치에서 이어 간다
function setupShot(sc, cont) {
  const box = document.getElementById('shot');
  if (cont) return true;
  // 캡처하지 못한 장면은 빈 화면 대신 이유 문구를 회색 면에 표시하고 줌하지 않는다
  if (sc.screen && sc.screen.unavailable) {
    box.hidden = false;
    box.innerHTML = `<div class="view"><div class="wait">${esc(sc.screen.unavailable)}</div></div>`;
    return false;
  }
  if (!sc.screen || !(sc.screen.startImg || F.screenImg)) { box.hidden = true; return false; }
  box.hidden = false;
  // 결과 화면을 미리 받아 두어, 줌할 때 내려받기를 기다리느라 화면이 늦게 바뀌지 않게 한다
  if (sc.screen.endImg) new Image().src = sc.screen.endImg;
  // 장면마다 화면 상태가 다르면 startImg · endImg 로 그 상태의 캡처를 쓴다(예: 기관을 고른 뒤의 화면)
  box.innerHTML = `<div class="cap"><i></i><span></span></div><div class="view"><img src="${esc(sc.screen.startImg || F.screenImg)}" alt=""><div class="mark"></div></div><div class="ex">예시 데이터로 그린 화면</div>`;
  camera(null, '대시보드 전체 화면', '#5B6C8C', true);
  return true;
}
let markSeq = 0;  // 카메라를 옮길 때마다 늘린다. 앞 이동의 상자 나타내기가 뒤 이동 중에 켜지지 않게 한다
// 화면 칸의 상자 색: 사람이 누르거나 입력하는 곳은 파랑, 결과가 나타나는 곳은 분홍이다. 남색은 대시보드의 남색 바탕과 겹쳐 보이지 않았다
const ACT = '#2563EB';
function camera(rect, label, color, instant, src) {
  const box = document.getElementById('shot');
  if (box.hidden) return;
  const view = box.querySelector('.view'), img = box.querySelector('img'), mark = box.querySelector('.mark');
  mark.innerHTML = '';  // 앞 연출에서 친 글자는 줌이 옮겨 가면 지운다
  const W = view.clientWidth, H = view.clientHeight, pad = 30;
  const [x, y, w, h] = rect || [0, 0, SHOT_W, SHOT_H];
  const k = rect ? Math.min(W / (w + pad * 2), H / (h + pad * 2), 1.6) : Math.min(W / SHOT_W, H / SHOT_H);
  const ox = (W - w * k) / 2 - x * k, oy = (H - h * k) / 2 - y * k;
  const dur = instant ? '0s' : (T(1800) / 1000) + 's';  // 줌은 천천히 보이도록 1.8초
  const ease = `all ${dur} cubic-bezier(.4,0,.2,1)`, to = `translate(${ox}px, ${oy}px) scale(${k})`;
  // 화면이 바뀌는 줌은 앞 화면을 위에 겹쳐 두고 줌하는 동안 서서히 지워, 줌과 화면 전환이 함께 일어나게 한다
  if (src && !img.src.endsWith(src)) {
    view.querySelectorAll('img.old').forEach(o => o.remove());
    const old = img.cloneNode();
    old.classList.add('old');
    img.after(old);
    img.src = src;
    requestAnimationFrame(() => { old.style.transition = ease; old.style.transform = to; old.style.opacity = 0; });
    wait(instant ? 0 : 1900).then(() => old.remove());
  }
  img.style.transition = ease;
  img.style.transform = to;
  // 강조 상자는 화면과 함께 움직이면 빈 곳을 가로지르므로, 화면이 움직이는 동안 숨겼다가 다 옮긴 뒤 그 자리에 나타낸다
  const seq = ++markSeq;
  mark.style.transition = 'none';
  Object.assign(mark.style, {left: (x * k + ox) + 'px', top: (y * k + oy) + 'px', width: w * k + 'px', height: h * k + 'px',
                             opacity: 0, borderColor: color});
  if (rect) wait(instant ? 0 : 1800).then(() => {
    if (seq !== markSeq) return;
    mark.style.transition = `opacity ${T(250) / 1000}s`; mark.style.opacity = 1;
  });
  box.querySelector('.cap i').style.background = color;
  box.querySelector('.cap span').textContent = label;
}

// play(i, keepAuto, k0, single): 장면 i 를 동작 k0 부터 재생한다. single 이면 그 동작 하나만 재생하고 멈춘다.
// curK 는 마지막으로 재생한(또는 재생 중인) 동작 번호다. 이전 · 다음 버튼과 목록 번호가 이 값을 기준으로 움직인다
let curK = 0;
// 외부 프로그램 · 시스템이 처음 쓰일 때: 노드에서 작은 창이 열리고 노드 테두리가 켜진다. 실제 탐색 시간은 생략한다
async function launchNode(n, my) {
  const st = document.getElementById('stage'), el = document.getElementById('n-' + n.id);
  document.getElementById('sub').textContent = `${n.name} 을(를) 엽니다`;
  const win = document.createElement('div');
  win.className = 'launchwin';
  win.style.left = n.x + 'px'; win.style.top = (n.y - 62) + 'px';
  st.appendChild(win);
  el.classList.add('hot');
  await win.animate([{transform: 'translate(-50%,-50%) translateY(50px) scale(.2)', opacity: 0},
                     {transform: 'translate(-50%,-50%) scale(1.08)', opacity: 1, offset: .7},
                     {transform: 'translate(-50%,-50%) scale(1)', opacity: 1}], {duration: T(900), fill: 'forwards'}).finished;
  if (my !== run) { win.remove(); return; }
  await wait(600);
  await win.animate([{opacity: 1}, {opacity: 0}], {duration: T(300), fill: 'forwards'}).finished;
  win.remove();
  el.classList.add('opened');
  document.getElementById('sub').textContent = '';
}
// 검색창 같은 입력 칸으로 줌한 뒤 글자를 한 글자씩 쳐 보인다
async function typeInto(text, my) {
  const mark = document.querySelector('#shot .mark');
  if (!mark) return;
  const span = document.createElement('span');
  span.className = 'typed';
  span.style.fontSize = Math.max(12, Math.min(22, mark.clientHeight * .5)) + 'px';
  mark.appendChild(span);
  for (const ch of text) {
    if (my !== run) return;
    span.textContent += ch;
    await wait(220);
  }
  await wait(900);
}
// 챗봇처럼 대화와 도구 호출로 진행되는 기능은 안내 규칙이 아직 없어 장면 없이 안내 문구만 보인다
function showChatbot() {
  ++run;
  document.getElementById('summary').textContent = F.summary || '';
  document.getElementById('kicker').textContent = F.name;
  document.getElementById('sceneTitle').textContent = '챗봇 기능 안내는 개발 중입니다';
  ['prereq', 'shot', 'tips'].forEach(id => document.getElementById(id).hidden = true);
  document.getElementById('log').innerHTML = '';
  document.getElementById('sub').textContent = '';
  document.getElementById('pg').textContent = '';
  ['all', 'part', 'pp', 'replay'].forEach(id => document.getElementById(id).disabled = true);
  document.querySelector('.body').hidden = true;
  busy = false; showPlay(); shown = '';
}
// shown 은 마지막으로 연 장면(「기능번호:장면번호」)이다. 바로 다음 장면을 열 때 화면이 이어지는지 판단한다
let shown = '';
async function play(i, keepAuto, k0 = 0, single = false) {
  if (!keepAuto) setAuto(false);
  setPaused(false);
  if (!F.scenes.length) return showChatbot();
  ['all', 'part', 'pp', 'replay'].forEach(id => document.getElementById(id).disabled = false);
  document.querySelector('.body').hidden = false;
  const my = ++run, sc = F.scenes[i];
  busy = true; showPlay();
  const startImg = sc.screen && (sc.screen.startImg || F.screenImg), curImg = document.querySelector('#shot:not([hidden]) .view img');
  const cont = k0 === 0 && i > 0 && shown === `${fi}:${i - 1}` && !!startImg && !!curImg && curImg.src.endsWith(startImg) && !(sc.screen && sc.screen.unavailable);
  shown = `${fi}:${i}`;
  document.getElementById('summary').textContent = D.features ? (F.summary || '') : '';
  cur = i;
  openCurrent();
  document.querySelectorAll('.step').forEach(el => el.classList.toggle('on', +el.dataset.f === fi && +el.dataset.i === i));
  document.getElementById('kicker').textContent = (D.features ? F.name + ' · ' : '') + `장면 ${i + 1} / ${F.scenes.length}`;
  document.getElementById('sceneTitle').innerHTML = esc(sc.title) + (sc.auto ? '<span class="autob">자동</span>' : '');
  // 앞 기능을 먼저 해야 하는 조건은 기능의 첫 장면 위에 띠로 보인다
  const pre = document.getElementById('prereq');
  pre.hidden = !(i === 0 && F.prereq);
  pre.innerHTML = pre.hidden ? '' : `<b>먼저 할 일</b>${esc(F.prereq)}`;
  const tipsBox = document.getElementById('tips'), tips = sc.tips || [];
  const core = tips.filter(t => t.level === 'core'), ref = tips.filter(t => t.level !== 'core');
  const tipLi = t => `<li class="${t.defect ? 'defect' : ''}">${t.defect ? '<em>결함</em>' : ''}${esc(t.text)}` +
    `${t.irreversible ? '<span class="irr">실행 후 되돌아가기 불가</span>' : ''}</li>`;
  tipsBox.hidden = !tips.length;
  tipsBox.innerHTML = '<b>알아 둘 점</b>' + (core.length ? `<ul class="core">${core.map(tipLi).join('')}</ul>` : '') +
    (ref.length ? `<details class="ref"><summary>참고 ${ref.length}개 더 보기</summary><ul>${ref.map(tipLi).join('')}</ul></details>` : '');
  const log = document.getElementById('log');
  log.innerHTML = sc.actions.map((a, j) => `<li data-k="${j}" title="눌러서 이 동작만 보기">${esc(a.say)}</li>`).join('');
  log.querySelectorAll('li').forEach(li => li.onclick = () => play(cur, auto, +li.dataset.k, !auto));
  drawStage();
  Object.entries(sc.nodeOverride || {}).forEach(([id, o]) => {  // 장면마다 같은 자리 노드의 이름을 바꿔 쓸 수 있다
    const el = document.getElementById('n-' + id);
    if (el) el.outerHTML = nodeHtml({...NODE.get(id), ...o});
  });
  const st = document.getElementById('stage'), wires = document.getElementById('wires'), sub = document.getElementById('sub');
  sub.textContent = '';
  curK = k0; navState();
  const shot = setupShot(sc, cont), last = sc.actions.length - 1;
  if (shot && k0 === 0) {
    await wait(500);
    if (my !== run) return;
    if (sc.screen.start) camera(sc.screen.start, sc.screen.startName || '누르는 곳', ACT);
    else camera(null, '사람이 누르지 않고 이어서 처리됩니다', '#5B6C8C');
    // 강조 상자는 화면 이동(1.8초)이 끝난 뒤 나타나므로, 누를 곳이 있으면 그만큼 더 머물러 상자가 보이는 시간을 지킨다
    await wait(sc.screen.start ? 2200 + 1800 : 2200);
    if (my !== run) return;
    if (sc.screen.start && sc.screen.typed) await typeInto(sc.screen.typed, my);
    if (my !== run) return;
  }
  // 글자를 친 장면은 그 뒤로 친 뒤의 화면(endImg)을 보여 준다
  const midImg = sc.screen && sc.screen.typed ? sc.screen.endImg : undefined;
  const opened = new Set();
  const showEnd = () => {
    if (sc.screen.end) camera(sc.screen.end, sc.screen.endName || '결과가 나타나는 곳', '#B5446E', false, sc.screen.endImg || sc.screen.startImg || F.screenImg);
    // 결과 위치를 찾지 못했어도 결과 화면을 찍었으면 전체 화면으로 결과 화면을 보인다
    else if (sc.screen.endImg) camera(null, sc.screen.endName || '결과 화면', '#B5446E', false, sc.screen.endImg);
    else camera(null, '이 장면은 화면을 바꾸지 않습니다', '#5B6C8C');
  };
  // 사람 동작(step)마다 찍은 동작 이미지. step 이 이미지 수 + 1 이면 마지막 사람 동작이라 결과 화면이다
  const FR = (sc.screen && sc.screen.frames) || [];
  const stepped = shot && sc.actions.some(x => x.step);
  // 사람 동작이 아닌 동작은 바로 앞 사람 동작 뒤의 화면 위에서 처리된다
  const imgBefore = k => {
    for (let j = k; j >= 0; j--) { const n = sc.actions[j].step; if (n) return n <= FR.length ? FR[n - 1].img : sc.screen.endImg; }
    return sc.screen.startImg || F.screenImg;
  };
  let endShown = false;
  for (let k = k0; k < sc.actions.length; k++) {
    if (single && k > k0) break;
    curK = k; navState();
    const n = sc.actions[k].step;
    if (stepped && n && n <= FR.length) camera(FR[n - 1].rect || null, sc.actions[k].text, ACT, false, FR[n - 1].img);
    else if (stepped && n) { showEnd(); endShown = true; }
    else if (stepped && k === k0 && k0 > 0 && !endShown) camera(null, '뒤에서 처리 중 · 대시보드 전체 화면', '#5B6C8C', false, imgBefore(k));
    if (!stepped && shot && k0 > 0 && k === k0 && k < last) camera(null, '뒤에서 처리 중 · 대시보드 전체 화면', '#5B6C8C', false, midImg);
    if (!stepped && shot && k === 1 && k < last) camera(null, '뒤에서 처리 중 · 대시보드 전체 화면', '#5B6C8C', false, midImg);
    if (shot && k === last && !endShown) showEnd();
    if (my !== run) return;
    const a = sc.actions[k], f = NODE.get(a.from), t = NODE.get(a.to), [color, svg] = ICON[a.icon] || ICON.card;
    [...log.children].forEach((li, j) => li.className = j < k ? 'done' : j === k ? 'now' : '');
    sub.textContent = '';
    document.querySelectorAll('.node').forEach(n => n.classList.remove('hot'));
    document.getElementById('n-' + a.from).classList.add('hot');
    for (const id of [a.from, a.to]) {
      const n = NODE.get(id);
      if (n.launch && !opened.has(id)) { opened.add(id); await launchNode(n, my); if (my !== run) return; }
    }
    wires.innerHTML = a.from === a.to ? '' : `<line x1="${f.x}" y1="${f.y}" x2="${t.x}" y2="${t.y}" stroke="${color}" stroke-width="2" stroke-dasharray="5 6" opacity=".55"/>`;
    const tok = document.createElement('div');
    tok.className = 'token';
    tok.style.borderColor = color; tok.style.color = color;
    // 한 번에 함께 오가는 정보 목록이 있으면 꾸러미 아이콘 아래에 칩으로 보인다
    if (a.items) tok.classList.add('pack');
    tok.innerHTML = `<svg viewBox="0 0 24 24">${svg}</svg><span style="color:#1A1A1A">${esc(a.text)}</span>` +
      (a.items ? `<span class="items">${a.items.map(x => `<em>${esc(x)}</em>`).join('')}</span>` : '');
    st.appendChild(tok);
    const w = tok.offsetWidth, h = tok.offsetHeight;
    // 아이콘이 무대 밖으로 잘리지 않도록 좌우 · 위아래를 무대 안으로 맞춘다
    const at = n => `translate(${Math.max(6, Math.min(960 - w - 6, n.x - w / 2))}px, ${Math.max(6, Math.min(460 - h - 6, n.y - h / 2 - 56))}px)`;
    await tok.animate([{transform: at(f) + ' scale(.6)', opacity: 0}, {transform: at(f) + ' scale(1)', opacity: 1}], {duration: T(350), fill: 'forwards'}).finished;
    if (my !== run) return;
    await wait(500);
    if (a.from === a.to)  // 노드 안에서 일어나는 일: 이동 없이 제자리에서 한 번 튄다
      await tok.animate([{transform: at(f)}, {transform: at(f) + ' translateY(-14px)'}, {transform: at(f)}], {duration: T(900), fill: 'forwards'}).finished;
    else
      await tok.animate([{transform: at(f)}, {transform: at(t)}], {duration: T(1600), easing: 'cubic-bezier(.45,.05,.3,1)', fill: 'forwards'}).finished;
    if (my !== run) return;
    const tn = document.getElementById('n-' + a.to);
    tn.classList.add('hot', 'ping');
    await wait(Math.max(1600, a.say.length * 45));
    if (my !== run) return;
    tn.classList.remove('ping');
    await tok.animate([{opacity: 1}, {opacity: 0}], {duration: T(300), fill: 'forwards'}).finished;
    tok.remove();
  }
  if (my !== run) return;
  if (single) {
    [...log.children].forEach((li, j) => li.className = j < curK ? 'done' : j === curK ? 'now' : '');
    sub.textContent = curK < last ? '진행 목록의 다음 번호를 누르면 다음 동작을 봅니다.' : '이 장면의 마지막 동작입니다. ⏭ 를 누르면 다음 장면으로 넘어갑니다.';
    return finish(my);
  }
  [...log.children].forEach(li => li.className = 'done');
  wires.innerHTML = '';
  document.querySelectorAll('.node').forEach(n => n.classList.remove('hot'));
  if (auto && cur < F.scenes.length - 1) {
    sub.textContent = '다음 장면으로 넘어갑니다.';
    await wait(1200);
    if (my === run) auto ? play(cur + 1, true) : finish(my);
    return;
  }
  if (auto) setAuto(false);
  sub.textContent = cur < F.scenes.length - 1 ? '⏭ 를 누르면 다음 장면을 봅니다.' : '여기까지가 이 기능의 흐름입니다.';
  finish(my);
}

// 재생 막대: 기능 재생 · 이전 장면 · 이 부분 다시 재생 · 재생과 정지 · 다음 장면 · 이 장면 다시 보기.
// 재생 중인 기능 재생을 누르면 멈추고, 다시 누르면 멈춘 곳부터 이어 간다
document.getElementById('all').onclick = () => {
  if (auto && busy) return setPaused(!paused);
  setAuto(true); play(0, true);
};
document.getElementById('pp').onclick = () => busy ? setPaused(!paused) : play(cur, auto);
document.getElementById('part').onclick = () => play(cur, auto, curK, !auto);
// 이전 · 다음 장면은 기능의 처음 · 끝에서 앞뒤 기능으로 넘어간다
function goScene(d) {
  if (F.scenes.length && d < 0 && cur > 0) return play(cur - 1, auto);
  if (F.scenes.length && d > 0 && cur < F.scenes.length - 1) return play(cur + 1, auto);
  const k = fi + d;
  if (!D.features || k < 0 || k >= FEATURES.length) return;
  useFeature(k);
  play(d < 0 ? Math.max(0, F.scenes.length - 1) : 0);
}
function navState() {
  const lastF = !D.features || fi === FEATURES.length - 1;
  document.getElementById('prevScene').disabled = cur === 0 && fi === 0;
  document.getElementById('nextScene').disabled = lastF && cur === F.scenes.length - 1;
  document.getElementById('pg').textContent = D.features ? `${fi + 1}. ${F.name}` : F.name || '';
}
document.getElementById('prevScene').onclick = () => goScene(-1);
document.getElementById('nextScene').onclick = () => goScene(1);
document.getElementById('replay').onclick = () => play(cur, auto);
// 키보드: 스페이스는 재생 · 정지, 좌우 방향키는 이전 · 다음 장면. 눌린 단추의 포커스는 풀어, 스페이스가 그 단추를 한 번 더 누르지 않게 한다
addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey || e.repeat) return;
  const typing = e.target.tagName === 'INPUT';
  if (e.code === 'Space') { e.preventDefault(); if (e.target.blur) e.target.blur(); document.getElementById('pp').click(); }
  else if (!typing && e.key === 'ArrowLeft') { e.preventDefault(); goScene(-1); }
  else if (!typing && e.key === 'ArrowRight') { e.preventDefault(); goScene(1); }
});
// 낮 · 밤 전환. 고른 값은 이 브라우저에만 기억하고, 고르지 않았으면 브라우저 설정을 따른다
const themeBtn = document.getElementById('theme');
function isDark() { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function showTheme() { themeBtn.textContent = isDark() ? '☀ 낮' : '☾ 밤'; }
try { const t = localStorage.getItem('flow-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
themeBtn.onclick = () => { const t = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem('flow-theme', t); } catch (e) {} showTheme(); };
showTheme();
// 사이드바 접기. 고른 상태는 브라우저에 기억한다
const foldBtn = document.getElementById('fold'), appEl = document.querySelector('.app');
function showFold() {
  const folded = appEl.classList.contains('folded'), label = folded ? '사이드바 펼치기' : '사이드바 접기';
  foldBtn.title = label; foldBtn.setAttribute('aria-label', label); foldBtn.setAttribute('aria-expanded', !folded);
}
try { if (localStorage.getItem('flow-rail') === 'folded') appEl.classList.add('folded'); } catch (e) {}
foldBtn.onclick = () => { appEl.classList.toggle('folded'); try { localStorage.setItem('flow-rail', appEl.classList.contains('folded') ? 'folded' : 'open'); } catch (e) {} showFold(); };
showFold();
useFeature(0);
drawRail();
play(0);
</script>
</body>
</html>
