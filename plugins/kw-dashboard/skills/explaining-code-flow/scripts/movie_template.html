<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!-- render.py 가 제목과 흐름 데이터를 채운다(자리표시 문자열을 여기 다시 적으면 주석 안에도 데이터가 들어간다). 장면마다 자료(파일 · 질문 · 답)가 노드 사이를 움직이며 흐름을 보인다. -->
<style>
:root{
  --brand:#1A1A1A; --sel-weak:rgba(0,0,0,.034); --hover-weak:rgba(0,0,0,.014); --accent:#27457D;
  --bg-app:#FFFFFF; --bg-rail:#FAFAFA; --rail-tint:linear-gradient(180deg,#F1F5FB 0%,#FAFAFA 52%,#FAFAFA 100%);
  --bg-surface:#FFFFFF; --bg-sunken:#F4F4F5; --bg-hover:#F0F0F1;
  --text-primary:#1A1A1A; --text-secondary:#5D5D5D; --text-tertiary:#8E8E8E;
  --border-light:#E5E5E5; --border-medium:#D1D1D1;
  --radius-sm:6px; --radius-md:10px;
}
*{box-sizing:border-box}
body{margin:0;min-width:1120px;background:var(--bg-app);color:var(--text-primary);font:14px/1.7 'Pretendard',-apple-system,'Segoe UI','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.rail{background:var(--bg-rail);background-image:var(--rail-tint);border-right:1px solid var(--border-light);position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column}
.rail-head{height:68px;display:flex;flex-direction:column;justify-content:center;padding:0 16px}
.rail-head .co{font-size:11px;font-weight:600;color:var(--text-tertiary);line-height:1.35}
.rail-head .dv{font-size:14px;font-weight:600;color:var(--text-secondary);line-height:1.25}
.rail-head.pick{cursor:pointer;position:relative}
.rail-head.pick:hover{background:var(--hover-weak)}
.rail-head.pick .dv{color:var(--text-primary)}
.rail-head.pick .dv::after{content:" ▾";color:var(--text-tertiary);font-size:12px}
.menu{position:absolute;left:10px;top:64px;width:300px;max-height:70vh;overflow:auto;z-index:20;background:#fff;border:1px solid var(--border-medium);border-radius:var(--radius-md);box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;display:none}
.menu.open{display:block}
.menu .it{padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer}
.menu .it:hover{background:var(--bg-hover)}
.menu .it.on{background:var(--sel-weak)}
.menu .it b{display:block;font-size:13px} .menu .it span{display:block;font-size:12px;color:var(--text-tertiary);line-height:1.45}
.summary{color:var(--text-secondary);margin:-6px 0 12px}
.rail-sec{font-size:11px;font-weight:600;color:var(--text-tertiary);padding:10px 18px 6px}
.steps{padding:0 10px 16px;overflow:auto}
.step{display:flex;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);color:var(--text-secondary);cursor:pointer;font-size:13px;line-height:1.45}
.step:hover{background:var(--hover-weak);color:var(--text-primary)}
.step.on{color:var(--brand);font-weight:700;background:var(--sel-weak)}
.step .no{color:var(--text-tertiary);min-width:18px}
.top{position:sticky;top:0;z-index:5;height:56px;display:flex;align-items:center;gap:18px;padding:0 32px;background:var(--bg-app);border-bottom:1px solid var(--border-light)}
.top h1{margin:0;font-size:17px;font-weight:700}
.top .repo{margin-left:auto;font-size:12px;color:var(--text-tertiary)}
.content{padding:20px 32px 96px}
.kicker{font-size:12px;color:var(--text-tertiary);font-weight:600}
.content h2{margin:2px 0 12px;font-size:22px;letter-spacing:-.02em}
.body{display:grid;grid-template-columns:960px minmax(260px,1fr);gap:24px;align-items:start}
/* 무대: 노드는 고정 위치, 자료 아이콘이 그 사이를 움직인다 */
.stage{position:relative;width:960px;height:460px;border:1px solid var(--border-light);border-radius:var(--radius-md);background:var(--bg-surface);overflow:hidden}
.group{position:absolute;border:1.5px dashed var(--zc);border-radius:14px;background:var(--zb)}
.group .gname{position:absolute;left:10px;top:-13px;display:flex;align-items:center;gap:5px;padding:2px 8px 2px 4px;font-size:12px;font-weight:700;color:var(--zc);background:#fff;border:1.5px solid var(--zc);border-radius:999px}
.group .gname svg{width:16px;height:16px;padding:2px;border-radius:50%;background:var(--zc)}
.node{position:absolute;width:172px;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;text-align:left;padding:9px 12px;
      border:1.5px solid var(--kc);border-radius:12px;background:var(--kb);transition:box-shadow .3s}
.node .ki{flex:none;width:30px;height:30px;border-radius:8px;background:var(--kc);display:grid;place-items:center}
.node .ki svg{width:18px;height:18px}
.node .kt{min-width:0}
.node b{display:block;font-size:13.5px;line-height:1.3}
.node span{display:block;font-size:11px;color:var(--text-secondary);line-height:1.35}
.node .kk{display:block;font-size:10px;font-weight:700;color:var(--text-tertiary);line-height:1.2}
.node .ki{background:#5B6C8C}
.node.hot{box-shadow:0 0 0 4px var(--kr)}
.kinds{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px;color:var(--text-secondary)}
.kinds i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.node.ping{animation:ping .6s ease}
@keyframes ping{40%{transform:translate(-50%,-50%) scale(1.06)}}
svg.wires{position:absolute;inset:0;pointer-events:none}
.token{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:999px;background:#fff;border:1.5px solid;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:3}
.token svg{width:20px;height:20px;flex:none}
.token.pack{flex-wrap:wrap;max-width:260px;border-radius:12px;padding:6px 10px 7px 6px}
.token .items{flex-basis:100%;display:flex;flex-wrap:wrap;gap:3px;padding-left:26px}
.token .items em{font-style:normal;font-size:11px;font-weight:600;color:#1A1A1A;background:#F1F3F7;border-radius:999px;padding:0 7px}
.sub{margin-top:6px;min-height:20px;font-size:13px;color:var(--text-tertiary)}
/* 무대 아래 진행 목록: 지금 동작을 굵게 · 회색 면으로 표시한다 */
.steps-now{margin-top:10px}
.steps-now h4{margin:0 0 8px;font-size:13px;color:var(--text-tertiary);font-weight:700}
.steps-now ol{margin:0;padding:0;list-style:none;counter-reset:st;font-size:16px;line-height:1.55}
.steps-now li{counter-increment:st;display:flex;gap:8px;margin-bottom:3px;padding:3px 10px;color:var(--text-tertiary);cursor:pointer;border-radius:8px}
.steps-now li::before{content:counter(st) ".";flex:none;min-width:22px;text-align:right}
.steps-now li:hover{background:var(--bg-hover)}
.steps-now li.done{color:var(--text-secondary)}
.steps-now li.now{color:var(--text-primary);font-weight:700;background:#EEF0F3}
/* 오른쪽 알아 둘 점: 화면을 쓰는 사람에게 가장 중요한 내용이라 크게 · 진하게 보인다 */
.tips{border:1.5px solid #27457D;background:#F5F8FD;padding:14px 16px;border-radius:var(--radius-md);font-size:15.5px;line-height:1.6}
.tips b{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:16px;color:#27457D}
.tips b::before{content:"!";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#27457D;color:#fff;font-size:13px}
.tips ul{margin:0;padding-left:20px}
.log .tips li{margin-bottom:8px;color:#0F1E3D;cursor:default;font-weight:500;border:0;padding:0}
.tips li:last-child{margin-bottom:0}
.log .tips li:hover{background:none}
.log{font-size:13px}
/* 실제 대시보드 화면 창: 장면 시작에는 누르는 곳, 결과가 돌아오면 결과가 나타나는 곳을 확대해 보인다 */
.shot{margin-bottom:16px;border:1px solid var(--border-medium);border-radius:var(--radius-md);overflow:hidden;background:#fff}
.shot .cap{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:12px;font-weight:700;border-bottom:1px solid var(--border-light)}
.shot .cap i{width:8px;height:8px;border-radius:50%}
/* 캡처는 백엔드 없이 가짜 데이터로 띄운 화면이라, 실제 값으로 오해하지 않도록 화면 아래에 늘 밝힌다 */
.shot .ex{padding:5px 10px;font-size:12px;color:var(--text-tertiary);border-top:1px solid var(--border-light)}
.shot .view{position:relative;width:100%;height:220px;overflow:hidden;background:#F4F4F5}
.shot .view img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0}
.shot .mark{position:absolute;border:3px solid;border-radius:6px;box-shadow:0 0 0 2000px rgba(0,0,0,.18)}
.shot .wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-secondary);font-size:15px;text-align:center;padding:0 16px}
.log h4{margin:0 0 6px;font-size:12px;color:var(--text-tertiary);font-weight:600}
.log ol{margin:0;padding-left:20px}
.log li{margin-bottom:8px;color:var(--text-tertiary)}
.log li.done{color:var(--text-secondary)}
.log li.now{color:var(--text-primary);font-weight:700}
.log li{cursor:pointer;border-radius:6px} .log li:hover{background:var(--bg-hover)}
.nav{position:fixed;left:264px;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:8px;padding:12px 32px;background:var(--bg-app);border-top:1px solid var(--border-light)}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--border-medium);background:var(--bg-surface);border-radius:var(--radius-sm);padding:8px 14px;cursor:pointer;color:var(--text-primary)}
.btn:hover{background:var(--bg-hover)} .btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.nav .pg{margin-left:auto;font-size:12px;color:var(--text-tertiary)}
.speed{display:flex;align-items:center;gap:8px;margin-left:16px;font-size:12px;color:var(--text-secondary)}
.speed input{width:140px;accent-color:var(--accent)}
.speed b{min-width:40px;color:var(--text-primary)}
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="rail-head" id="railHead"><span class="co" id="railCo">동작 흐름 · 움직이며 보기</span><span class="dv" id="railTitle"></span><div class="menu" id="menu"></div></div>
    <div class="rail-sec">장면</div>
    <div class="steps" id="steps"></div>
  </nav>
  <div>
    <header class="top"><h1 id="title"></h1><span class="repo" id="repo"></span></header>
    <main class="content">
      <div class="kicker" id="kicker"></div><h2 id="sceneTitle"></h2><p class="summary" id="summary"></p>
      <div class="body">
        <div><div class="stage" id="stage"></div><div class="kinds" id="kinds"></div>
          <div class="steps-now"><h4>이 장면에서 일어나는 일 · 번호를 누르면 그 동작만 봅니다</h4><ol id="log"></ol><div class="sub" id="sub"></div></div></div>
        <div class="log"><div class="shot" id="shot" hidden></div><div class="tips" id="tips" hidden></div></div>
      </div>
    </main>
    <div class="nav">
      <button class="btn primary" id="all">▶ 전체 재생</button><button class="btn" id="first">처음부터</button><button class="btn" id="prev">◀ 이전 동작</button>
      <button class="btn" id="next">다음 동작 ▶</button><button class="btn" id="replay">이 장면 다시 보기</button>
      <label class="speed">재생 속도 <input type="range" id="speed" min="0.5" max="2" step="0.25" value="1"><b id="speedVal">1배</b></label>
      <span class="pg" id="pg"></span>
    </div>
  </div>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
// 기능이 여럿이면 D.features, 하나면 D 자체가 기능 하나다. 노드의 종류 · 구역 · 좌표는 JSON 이 적는다.
const FEATURES = D.features || [D];
// 구역: 누가 운영하는 곳인가. 구역 상자는 속한 노드를 감싸도록 계산한다.
const ZONE = {
  office:   {name: '내 PC · 사무실', c: '#27457D', b: 'rgba(39,69,125,.035)', i: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'},
  app:      {name: D.appZone || '서비스', c: '#1E8284', b: 'rgba(30,130,132,.04)', i: '<path d="M7 18a4 4 0 0 1-.6-8 5.5 5.5 0 0 1 10.7 1.5A3.3 3.3 0 0 1 17 18z"/>'},
  ax:       {name: 'AX팀 서버', c: '#1E8284', b: 'rgba(30,130,132,.04)', i: '<rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/>'},
  winus:    {name: 'WINUS (회사 DW)', c: '#5C77A6', b: 'rgba(92,119,166,.05)', i: '<ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-13"/>'},
  fund:     {name: '우리펀드서비스', c: '#5C77A6', b: 'rgba(92,119,166,.05)', i: '<ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-13"/>'},
  external: {name: '외부 서비스', c: '#B5446E', b: 'rgba(181,68,110,.035)', i: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>'}
};
const zoneOf = n => n.zone;
let F, NODE, fi = 0;
function useFeature(k) {
  fi = k; F = FEATURES[k];
  // 좌표는 높이 520 기준으로 적혀 있다. 아래 진행 목록이 한 화면에 들어오도록 무대를 460 으로 줄이고 세로 좌표를 줄인다
  if (!F.scaled) { F.scaled = true;
    F.nodes = F.nodes.map(n => ({...n, y: Math.round(30 + (n.y - 30) * 0.86)})); }
  NODE = new Map(F.nodes.map(n => [n.id, n]));
}
function zoneBoxes() {
  const by = {};
  F.nodes.forEach(n => { const z = zoneOf(n); if (z) (by[z] = by[z] || []).push(n); });
  return Object.entries(by).map(([z, ns]) => {
    const x1 = Math.min(...ns.map(n => n.x)) - 100, x2 = Math.max(...ns.map(n => n.x)) + 100;
    const y1 = Math.min(...ns.map(n => n.y)) - 58, y2 = Math.max(...ns.map(n => n.y)) + 52;
    const L = Math.max(6, x1), T = Math.max(14, y1);
    return {z, x: L, y: T, w: Math.min(954, x2) - L, h: Math.min(454, y2) - T};
  });
}
// 자료 종류마다 아이콘과 색. 색은 리스크 관리 발표 덱의 남색 · 청록 · 핑크 계열이다.
const ICON = {
  file:   ['#27457D', '<path d="M6 2h8l5 5v15H6z" fill="#E5E9F1" stroke="currentColor" stroke-width="1.6"/><path d="M14 2v5h5" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="12.5" y="18" font-size="6" text-anchor="middle" fill="currentColor" font-weight="700">PDF</text>'],
  path:   ['#1E8284', '<path d="M12 22s7-7 7-12a7 7 0 0 0-14 0c0 5 7 12 7 12z" fill="#DBEBEB" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="10" r="2.5" fill="currentColor"/>'],
  ask:    ['#5C77A6', '<circle cx="12" cy="12" r="9.5" fill="#E5E9F1" stroke="currentColor" stroke-width="1.6"/><text x="12" y="16.5" font-size="12" text-anchor="middle" fill="currentColor" font-weight="700">?</text>'],
  card:   ['#5B6C8C', '<rect x="3" y="5" width="18" height="14" rx="2" fill="#EEF2F9" stroke="currentColor" stroke-width="1.6"/><path d="M7 10h10M7 14h6" stroke="currentColor" stroke-width="1.6"/>'],
  list:   ['#5B6C8C', '<path d="M8 7h12M8 12h12M8 17h12" stroke="currentColor" stroke-width="1.8"/><circle cx="4.5" cy="7" r="1.4" fill="currentColor"/><circle cx="4.5" cy="12" r="1.4" fill="currentColor"/><circle cx="4.5" cy="17" r="1.4" fill="currentColor"/>'],
  stack:  ['#176668', '<rect x="6" y="3" width="13" height="15" rx="2" fill="#DAE7E7" stroke="currentColor" stroke-width="1.4"/><rect x="4" y="6" width="13" height="15" rx="2" fill="#fff" stroke="currentColor" stroke-width="1.6"/><path d="M7 11h7M7 15h5" stroke="currentColor" stroke-width="1.4"/>'],
  bundle: ['#B5446E', '<path d="M3 8l9-5 9 5v9l-9 5-9-5z" fill="#F3E1E8" stroke="currentColor" stroke-width="1.6"/><path d="M3 8l9 5 9-5M12 13v9" fill="none" stroke="currentColor" stroke-width="1.4"/>'],
  answer: ['#9A3459', '<path d="M4 4h16v12H9l-5 4z" fill="#EFDFE4" stroke="currentColor" stroke-width="1.6"/><path d="M8 10l2.5 2.5L16 7" fill="none" stroke="currentColor" stroke-width="1.8"/>'],
  check:  ['#1E8284', '<circle cx="12" cy="12" r="9.5" fill="#DBEBEB" stroke="currentColor" stroke-width="1.6"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="2"/>'],
  table:  ['#27457D', '<rect x="3" y="4" width="18" height="16" rx="2" fill="#E5E9F1" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M3 14h18M10 9v11" stroke="currentColor" stroke-width="1.3"/>']
};
let cur = 0, run = 0;  // run 이 바뀌면 진행 중인 재생을 멈춘다

document.getElementById('title').textContent = D.title;
function drawRail() {
  const head = document.getElementById('railHead'), menu = document.getElementById('menu');
  document.getElementById('railTitle').textContent = D.features ? F.name : D.title;
  if (D.features) {
    head.classList.add('pick');
    document.getElementById('railCo').textContent = '기능 고르기';
    menu.innerHTML = FEATURES.map((f, k) => `<div class="it ${k === fi ? 'on' : ''}" data-k="${k}"><b>${esc(f.name)}</b><span>${esc(f.summary || '')}</span></div>`).join('');
    menu.querySelectorAll('.it').forEach(el => el.onclick = e => { e.stopPropagation(); menu.classList.remove('open'); useFeature(+el.dataset.k); drawRail(); play(0); });
    head.onclick = () => menu.classList.toggle('open');
  }
  document.getElementById('steps').innerHTML = F.scenes.map((s, i) =>
    `<div class="step" data-i="${i}"><span class="no">${i + 1}</span><span>${esc(s.title)}</span></div>`).join('');
  document.querySelectorAll('.step').forEach(el => el.onclick = () => play(+el.dataset.i, auto));
}
document.addEventListener('click', e => { if (!e.target.closest('#railHead')) document.getElementById('menu').classList.remove('open'); });
document.getElementById('repo').textContent = D.repo || '';

// 노드 종류: 종류마다 색과 아이콘이 있다. 색은 리스크 관리 발표 덱의 남색 · 청록 · 핑크 계열이다.
const KIND = {
  screen: {label: '사람이 보는 화면', c: '#27457D', b: '#EEF2F9', i: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'},
  server: {label: '서버 · 프로그램', c: '#1E8284', b: '#EAF4F4', i: '<rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M8 6.5h.01M8 17.5h.01"/>'},
  db:     {label: '저장소 · DB', c: '#5C77A6', b: '#EFF2F8', i: '<ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-13M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/>'},
  ai:     {label: 'AI 모델', c: '#B5446E', b: '#F8ECF1', i: '<path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4z"/><path d="M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/>'},
  web:    {label: '외부 사이트', c: '#176668', b: '#E9F2F2', i: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>'},
  local:  {label: '팀 공용폴더', c: '#9A3459', b: '#F5EAEE', i: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'},
  officepc: {label: '담당자 PC', c: '#27457D', b: '#EEF2F9', i: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'},
  code:   {label: '샘플 데이터', c: '#5B6C8C', b: '#F1F3F7', i: '<path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/>'},
  clock:  {label: '정해진 시각 자동 실행', c: '#5B6C8C', b: '#F1F3F7', keepIcon: true, i: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'}
};
const kindOf = n => n.kind;
function nodeHtml(n) {
  const k = KIND[kindOf(n)];
  // 구역 상자 안의 노드는 구역 이름에 아이콘이 있으므로 아이콘을 빼고 종류 이름과 색만 둔다
  // 정해진 시각 자동 실행은 사람이 시작하지 않는다는 점이 중요해서 구역 안에서도 시계 아이콘을 둔다
  const icon = zoneOf(n) && !k.keepIcon ? '' : `<div class="ki"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${k.i}</svg></div>`;
  // 상자는 회색 테두리 하나로 두고, 색은 구역 상자만 쓴다. 지금 움직이는 상자는 구역 색으로 강조한다
  const z = ZONE[zoneOf(n)], hot = z ? z.c : '#27457D';
  return `<div class="node" id="n-${n.id}" style="left:${n.x}px;top:${n.y}px;--kc:#B8BEC6;--kb:#fff;--kr:${hot}2B">` + icon +
    `<div class="kt"><span class="kk">${k.label}</span><b>${esc(n.name)}</b><span>${esc(n.sub || '')}</span></div></div>`;
}

function drawStage() {
  const st = document.getElementById('stage');
  st.innerHTML = '<svg class="wires" id="wires" width="960" height="460"></svg>' + F.nodes.map(n => nodeHtml(n)).join('');
  st.insertAdjacentHTML('afterbegin', zoneBoxes().map(g => `<div class="group" style="left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px;--zc:${ZONE[g.z].c};--zb:${ZONE[g.z].b}"><span class="gname"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ZONE[g.z].i}</svg>${esc((F.zoneNames || {})[g.z] || ZONE[g.z].name)}</span></div>`).join(''));
  document.getElementById('kinds').innerHTML = '';
}

// 재생 속도: 모든 이동 · 멈춤 시간을 이 배수로 나눈다. 바꾸면 진행 중인 움직임에도 바로 적용된다
let SPEED = 1;
try { SPEED = +localStorage.getItem('flow-speed') || 1; } catch (e) {}
const T = ms => ms / SPEED;
const wait = ms => new Promise(r => setTimeout(r, T(ms)));
(() => {
  const el = document.getElementById('speed'), out = document.getElementById('speedVal');
  const show = () => out.textContent = (Number.isInteger(SPEED) ? SPEED : SPEED.toFixed(2).replace(/0$/, '')) + '배';
  el.value = SPEED; show();
  el.oninput = () => {
    SPEED = +el.value; show();
    document.getAnimations().forEach(a => a.playbackRate = SPEED);
    try { localStorage.setItem('flow-speed', SPEED); } catch (e) {}
  };
})();

// auto 가 참이면 장면이 끝난 뒤 다음 장면을 이어서 재생한다(전체 재생). 전체 재생 중에 이전 · 다음 장면이나
// 장면 목록을 눌러도 그 장면으로 옮겨 가서 이어서 재생하고, 「전체 재생 멈춤」이나 다른 기능을 고를 때만 멈춘다
let auto = false;
function setAuto(on) {
  auto = on;
  document.getElementById('all').textContent = on ? '■ 전체 재생 멈춤' : '▶ 전체 재생';
}
// 화면 창: 실제 대시보드 캡처(1440×1000) 위를 카메라처럼 움직인다. rect 는 캡처 안의 [x, y, 폭, 높이]다.
// 장면 시작에는 전체 화면에서 누를 곳으로 확대하고, 뒤에서 동작이 이어지는 동안 전체로 줌아웃했다가,
// 결과가 돌아오는 마지막 동작에서 결과가 나타나는 곳으로 확대한다.
const SHOT_W = 1440, SHOT_H = 1000;
function setupShot(sc) {
  const box = document.getElementById('shot');
  // 캡처하지 못한 장면은 빈 화면 대신 이유 문구를 회색 면에 표시하고 줌하지 않는다
  if (sc.screen && sc.screen.unavailable) {
    box.hidden = false;
    box.innerHTML = `<div class="view"><div class="wait">${esc(sc.screen.unavailable)}</div></div>`;
    return false;
  }
  if (!sc.screen || !(sc.screen.startImg || F.screenImg)) { box.hidden = true; return false; }
  box.hidden = false;
  // 장면마다 화면 상태가 다르면 startImg · endImg 로 그 상태의 캡처를 쓴다(예: 기관을 고른 뒤의 화면)
  box.innerHTML = `<div class="cap"><i></i><span></span></div><div class="view"><img src="${esc(sc.screen.startImg || F.screenImg)}" alt=""><div class="mark"></div></div><div class="ex">예시 데이터로 그린 화면</div>`;
  camera(null, '대시보드 전체 화면', '#5B6C8C', true);
  return true;
}
function camera(rect, label, color, instant, src) {
  const box = document.getElementById('shot');
  if (box.hidden) return;
  const view = box.querySelector('.view'), img = box.querySelector('img'), mark = box.querySelector('.mark');
  if (src && !img.src.endsWith(src)) img.src = src;
  const W = view.clientWidth, H = view.clientHeight, pad = 30;
  const [x, y, w, h] = rect || [0, 0, SHOT_W, SHOT_H];
  const k = rect ? Math.min(W / (w + pad * 2), H / (h + pad * 2), 1.6) : Math.min(W / SHOT_W, H / SHOT_H);
  const ox = (W - w * k) / 2 - x * k, oy = (H - h * k) / 2 - y * k;
  const dur = instant ? '0s' : (T(1800) / 1000) + 's';  // 줌은 천천히 보이도록 1.8초
  img.style.transition = mark.style.transition = `all ${dur} cubic-bezier(.4,0,.2,1)`;
  img.style.transform = `translate(${ox}px, ${oy}px) scale(${k})`;
  Object.assign(mark.style, {left: (x * k + ox) + 'px', top: (y * k + oy) + 'px', width: w * k + 'px', height: h * k + 'px',
                             opacity: rect ? 1 : 0, borderColor: color});
  box.querySelector('.cap i').style.background = color;
  box.querySelector('.cap span').textContent = label;
}

// play(i, keepAuto, k0, single): 장면 i 를 동작 k0 부터 재생한다. single 이면 그 동작 하나만 재생하고 멈춘다.
// curK 는 마지막으로 재생한(또는 재생 중인) 동작 번호다. 이전 · 다음 버튼과 목록 번호가 이 값을 기준으로 움직인다
let curK = 0;
async function play(i, keepAuto, k0 = 0, single = false) {
  if (!keepAuto) setAuto(false);
  const my = ++run, sc = F.scenes[i];
  document.getElementById('summary').textContent = D.features ? (F.summary || '') : '';
  cur = i;
  document.querySelectorAll('.step').forEach((el, k) => el.classList.toggle('on', k === i));
  document.getElementById('kicker').textContent = (D.features ? F.name + ' · ' : '') + `장면 ${i + 1} / ${F.scenes.length}`;
  document.getElementById('sceneTitle').textContent = sc.title;
  const tipsBox = document.getElementById('tips'), tips = sc.tips || [];
  tipsBox.hidden = !tips.length;
  tipsBox.innerHTML = `<b>알아 둘 점</b><ul>${tips.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  const log = document.getElementById('log');
  log.innerHTML = sc.actions.map((a, j) => `<li data-k="${j}" title="눌러서 이 동작만 보기">${esc(a.say)}</li>`).join('');
  log.querySelectorAll('li').forEach(li => li.onclick = () => play(cur, auto, +li.dataset.k, !auto));
  drawStage();
  Object.entries(sc.nodeOverride || {}).forEach(([id, o]) => {  // 장면마다 같은 자리 노드의 이름을 바꿔 쓸 수 있다
    const el = document.getElementById('n-' + id);
    if (el) el.outerHTML = nodeHtml({...NODE.get(id), ...o});
  });
  const st = document.getElementById('stage'), wires = document.getElementById('wires'), sub = document.getElementById('sub');
  sub.textContent = '';
  curK = k0; navState();
  const shot = setupShot(sc), last = sc.actions.length - 1;
  if (shot && k0 === 0) {
    await wait(500);
    if (my !== run) return;
    if (sc.screen.start) camera(sc.screen.start, sc.screen.startName || '누르는 곳', '#27457D');
    else camera(null, '사람이 누르지 않고 이어서 처리됩니다', '#5B6C8C');
    await wait(2200);
    if (my !== run) return;
  }
  for (let k = k0; k < sc.actions.length; k++) {
    if (single && k > k0) break;
    curK = k; navState();
    if (shot && k0 > 0 && k === k0 && k < last) camera(null, '뒤에서 처리 중 · 대시보드 전체 화면', '#5B6C8C');
    if (shot && k === 1 && k < last) camera(null, '뒤에서 처리 중 · 대시보드 전체 화면', '#5B6C8C');
    if (shot && k === last) {
      if (sc.screen.end) camera(sc.screen.end, sc.screen.endName || '결과가 나타나는 곳', '#B5446E', false, sc.screen.endImg || sc.screen.startImg || F.screenImg);
      else camera(null, '이 장면은 화면을 바꾸지 않습니다', '#5B6C8C');
    }
    if (my !== run) return;
    const a = sc.actions[k], f = NODE.get(a.from), t = NODE.get(a.to), [color, svg] = ICON[a.icon] || ICON.card;
    [...log.children].forEach((li, j) => li.className = j < k ? 'done' : j === k ? 'now' : '');
    sub.textContent = '';
    document.querySelectorAll('.node').forEach(n => n.classList.remove('hot'));
    document.getElementById('n-' + a.from).classList.add('hot');
    wires.innerHTML = a.from === a.to ? '' : `<line x1="${f.x}" y1="${f.y}" x2="${t.x}" y2="${t.y}" stroke="${color}" stroke-width="2" stroke-dasharray="5 6" opacity=".55"/>`;
    const tok = document.createElement('div');
    tok.className = 'token';
    tok.style.borderColor = color; tok.style.color = color;
    // 한 번에 함께 오가는 정보 목록이 있으면 꾸러미 아이콘 아래에 칩으로 보인다
    if (a.items) tok.classList.add('pack');
    tok.innerHTML = `<svg viewBox="0 0 24 24">${svg}</svg><span style="color:#1A1A1A">${esc(a.text)}</span>` +
      (a.items ? `<span class="items">${a.items.map(x => `<em>${esc(x)}</em>`).join('')}</span>` : '');
    st.appendChild(tok);
    const w = tok.offsetWidth, h = tok.offsetHeight;
    // 아이콘이 무대 밖으로 잘리지 않도록 좌우 · 위아래를 무대 안으로 맞춘다
    const at = n => `translate(${Math.max(6, Math.min(960 - w - 6, n.x - w / 2))}px, ${Math.max(6, Math.min(460 - h - 6, n.y - h / 2 - 56))}px)`;
    await tok.animate([{transform: at(f) + ' scale(.6)', opacity: 0}, {transform: at(f) + ' scale(1)', opacity: 1}], {duration: T(350), fill: 'forwards'}).finished;
    if (my !== run) return;
    await wait(500);
    if (a.from === a.to)  // 노드 안에서 일어나는 일: 이동 없이 제자리에서 한 번 튄다
      await tok.animate([{transform: at(f)}, {transform: at(f) + ' translateY(-14px)'}, {transform: at(f)}], {duration: T(900), fill: 'forwards'}).finished;
    else
      await tok.animate([{transform: at(f)}, {transform: at(t)}], {duration: T(1600), easing: 'cubic-bezier(.45,.05,.3,1)', fill: 'forwards'}).finished;
    if (my !== run) return;
    const tn = document.getElementById('n-' + a.to);
    tn.classList.add('hot', 'ping');
    await wait(Math.max(1600, a.say.length * 45));
    if (my !== run) return;
    tn.classList.remove('ping');
    await tok.animate([{opacity: 1}, {opacity: 0}], {duration: T(300), fill: 'forwards'}).finished;
    tok.remove();
  }
  if (my !== run) return;
  if (single) {
    [...log.children].forEach((li, j) => li.className = j < curK ? 'done' : j === curK ? 'now' : '');
    sub.textContent = curK < last ? '「다음」을 누르면 다음 동작을 봅니다.' : '이 장면의 마지막 동작입니다. 「다음」을 누르면 다음 장면으로 넘어갑니다.';
    return;
  }
  [...log.children].forEach(li => li.className = 'done');
  wires.innerHTML = '';
  document.querySelectorAll('.node').forEach(n => n.classList.remove('hot'));
  if (auto && cur < F.scenes.length - 1) {
    sub.textContent = '다음 장면으로 넘어갑니다.';
    await wait(1200);
    if (my === run && auto) play(cur + 1, true);
    return;
  }
  if (auto) setAuto(false);
  sub.textContent = cur < F.scenes.length - 1 ? '「다음 장면」을 누르면 이어서 봅니다.' : '여기까지가 이 기능의 흐름입니다.';
}

document.getElementById('first').onclick = () => play(0, auto);
document.getElementById('all').onclick = () => {
  if (auto) { setAuto(false); run++; return; }  // 재생 중에 누르면 그 자리에서 멈춘다
  setAuto(true); play(0, true);
};
// 이전 · 다음은 동작 하나씩 움직이고, 장면 끝에서는 앞뒤 장면으로 넘어간다
function navState() {
  const last = F.scenes[cur].actions.length - 1;
  document.getElementById('prev').disabled = cur === 0 && curK === 0;
  document.getElementById('next').disabled = cur === F.scenes.length - 1 && curK === last;
  document.getElementById('pg').textContent = `장면 ${cur + 1} / ${F.scenes.length} · 동작 ${curK + 1} / ${last + 1}`;
}
document.getElementById('prev').onclick = () => {
  if (curK > 0) play(cur, auto, curK - 1, !auto);
  else if (cur > 0) play(cur - 1, auto, F.scenes[cur - 1].actions.length - 1, !auto);
};
document.getElementById('next').onclick = () => {
  if (curK < F.scenes[cur].actions.length - 1) play(cur, auto, curK + 1, !auto);
  else if (cur < F.scenes.length - 1) play(cur + 1, auto, 0, !auto);
};
document.getElementById('replay').onclick = () => play(cur, auto);
useFeature(0);
drawRail();
play(0);
</script>
</body>
</html>
