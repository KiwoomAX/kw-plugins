<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 배치: 왼쪽 기능 · 장면 목록, 오른쪽 위 장면 제목, 그 아래 캡처와 하는 일 · 알아 둘 점(캡처 윗변에 맞춤), 아래 고정 재생 막대 */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --fg:#1B2433; --muted:#5D6778; --line:#DDE2EA;
  --accent:#27457D; --accent-soft:#E8EEF8; --brand:#1A1A1A; --warn:#B4541A; --warn-soft:#FCEFE6; --hit:#B5446E; --pin:#C2410C;
  --font:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13171E; --surface:#1B212B; --fg:#E6EAF0; --muted:#9AA4B5; --line:#2E3746;
  --accent:#8FB0E6; --accent-soft:#223049; --brand:#E6EAF0; --warn:#F0A36B; --warn-soft:#3A2618; --hit:#E78AAE; --pin:#F97316; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13171E; --surface:#1B212B; --fg:#E6EAF0; --muted:#9AA4B5; --line:#2E3746;
  --accent:#8FB0E6; --accent-soft:#223049; --brand:#E6EAF0; --warn:#F0A36B; --warn-soft:#3A2618; --hit:#E78AAE; --pin:#F97316; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.6;margin:0}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;max-width:2400px;margin:0 auto;padding-block:20px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:1100px){.app{grid-template-columns:minmax(0,1fr)}}
.list{font-size:15px;position:sticky;top:16px;align-self:start;max-height:calc(100vh / var(--z, 1) - 112px);overflow:auto}
@media (max-width:1100px){.list{position:static;max-height:none}}
.list h1{font-size:16px;margin:0 0 4px}
.list .note{color:var(--muted);font-size:12px;margin:0 0 14px}
.feat{margin-bottom:12px}
.feat .fh{display:flex;gap:6px;align-items:baseline;width:100%;text-align:left;font:inherit;font-size:17px;font-weight:700;color:var(--fg);background:none;border:0;border-radius:8px;padding:6px 10px;margin-top:8px;cursor:pointer}
.feat .fh:hover{background:var(--accent-soft)}
.feat .fh .chev{color:var(--muted);font-size:12px;min-width:12px}
.app.folded{grid-template-columns:minmax(0,1fr)} .app.folded .list{display:none}
.feat button.sc{display:flex;gap:8px;width:100%;text-align:left;font:inherit;font-size:15px;color:var(--fg);background:none;border:0;border-radius:8px;padding:7px 10px;cursor:pointer;line-height:1.45}
.feat button.sc:hover{background:var(--accent-soft)}
.feat button.sc.on{background:var(--accent-soft);font-weight:700}
.feat button.sc .no{color:var(--muted);min-width:16px}
.badge{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:2px}
.main{min-width:0}
.row{display:grid;grid-template-columns:minmax(0,var(--lf,3fr)) 12px minmax(300px,var(--rf,2fr));gap:12px;align-items:start}
/* 캡처 칸과 오른쪽 칸 사이 구분선. 끌면 두 칸의 폭 비율이 바뀐다(개발자용 화면 틀과 같은 방식) */
.split{align-self:stretch;cursor:col-resize;position:relative;min-height:200px}
.split::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;border-radius:2px;background:var(--line)}
.split:hover::before,.split.drag::before{background:var(--accent)}
@media (max-width:1100px){.row{grid-template-columns:minmax(0,1fr)}.split{display:none}}
.kicker{font-size:14px;font-weight:700;color:var(--muted)}
.scene{font-size:26px;letter-spacing:-.02em;margin:2px 0 12px;text-wrap:balance}
.pre{border:1.5px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:15px}
.pre b{color:var(--warn);margin-right:8px}
.shot{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.cap{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px;font-weight:700;border-bottom:1px solid var(--line)}
.cap i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.view{position:relative;width:100%;aspect-ratio:1440/1000;max-height:calc(66vh / var(--z, 1));overflow:hidden;background:#EEF0F3}
.layer{position:absolute;left:0;top:0;width:1440px;height:1000px;transform-origin:0 0}
.layer img{display:block;width:1440px;height:1000px;max-width:none}
/* 번호는 칸 글자를 가리지 않도록 작게 하고, 칸 왼쪽 위 모서리 바깥에 걸친다 */
.pinx{opacity:0;transition:opacity .15s;position:absolute;transform:translate(-85%,-85%);width:32px;height:32px;border-radius:50%;background:var(--pin);color:#fff;font-size:17px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 3px #fff}
.pinbox{position:absolute;border:4px solid var(--pin);border-radius:8px;opacity:0;transition:opacity .15s}
.pinbox.on,.pinx.on{opacity:1}
.areas tr{cursor:pointer}
.areas tr.sel{background:var(--surface);box-shadow:inset 3px 0 0 var(--pin)}
.wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:16px;text-align:center;padding:0 16px;background:var(--bg)}
.mark{position:absolute;border:3px solid var(--hit);border-radius:6px;box-shadow:0 0 0 3000px rgba(0,0,0,.16);pointer-events:none}
.typed{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-weight:700;color:#1A1A1A;background:#fff;padding:0 3px;white-space:nowrap}
.typed::after{content:"";display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-.15em;background:#27457D;animation:caret .8s step-end infinite}
@keyframes caret{50%{opacity:0}}
.ex{padding:5px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
/* 재생 막대: 화면 아래에 고정 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:2400px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:8px 14px;cursor:pointer}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--brand);color:var(--surface);border-color:var(--brand)}
.btn:focus-visible,.feat button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.speed{display:flex;align-items:center;gap:8px;margin-left:16px;font-size:12px;color:var(--muted)}
.speed input{width:140px;accent-color:var(--accent)}
.speed b{min-width:40px;color:var(--fg)}
.pg{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 오른쪽: 하는 일이 가장 눈에 띄고, 알아 둘 점은 그다음 */
.side{min-width:0;position:sticky;top:16px;align-self:start;display:grid;gap:14px;max-height:calc(100vh / var(--z, 1) - 120px);overflow:auto}
.doing{background:var(--accent-soft);border:2px solid var(--accent);border-radius:12px;padding:18px 20px}
.doing h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:16px;color:var(--accent)}
.doing p{margin:0;font-size:20px;font-weight:700;line-height:1.5}
.src{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--muted)}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--surface);color:var(--fg)}
.know{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.know h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px;color:var(--fg)}
.know h3::before{content:"!";display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--muted);color:var(--surface);font-size:13px}
.tips{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tips li{font-size:17px;font-weight:500;line-height:1.5}
.irr{display:block;font-size:13px;font-weight:700;color:var(--warn);margin-top:2px}
details{margin-top:12px;font-size:14px;color:var(--muted)}
summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
details ul{margin:8px 0 0;padding-left:18px}
.none{color:var(--muted);font-size:14px;margin:0}
.refh{margin:14px 0 6px;font-size:13px;color:var(--muted)}
.refs{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.areas{width:100%;border-collapse:collapse;font-size:15px}
.areas td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.areas tr:last-child td{border-bottom:0}
.areas tr.on{background:var(--surface)}
.areas .n{width:24px;height:24px;border-radius:50%;background:var(--pin);color:#fff;font-weight:700;display:grid;place-items:center;font-size:12.5px}
.areas b{display:block}
.areas span{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.typed::after{animation:none}}
</style>

<div class="app">
  <aside class="list">
    <h1 id="manualTitle"></h1>
    <div id="feats"></div>
  </aside>

  <main class="main">
    <div class="kicker" id="kicker"></div>
    <h2 class="scene" id="scene"></h2>
    <div class="pre" id="pre" hidden></div>
    <div class="row">
    <div class="shot">
      <div class="cap"><i id="capDot"></i><span id="capText"></span></div>
      <div class="view" id="view"><div class="layer" id="layer"><img id="img" alt="화면 캡처"><div id="pins"></div></div><div class="mark" id="mark"></div></div>
      <div class="ex">예시 데이터로 그린 화면</div>
    </div>
    <div class="split" id="split" title="끌어서 왼쪽 · 오른쪽 폭을 조절합니다"></div>
    <aside class="side">
      <div class="doing">
        <h3>이 기능으로 하는 일</h3>
        <p id="how"></p>
        <div class="src" id="src"></div>
      </div>
      <div class="know">
        <h3 id="knowTitle">알아 둘 점</h3>
        <div id="tips"></div>
      </div>
    </aside>
    </div>
  </main>

</div>

<div class="bar"><div class="in">
  <button class="btn" id="fold" type="button"></button>
  <button class="btn primary" id="all">▶ 전체 재생</button>
  <button class="btn" id="prev">◀ 이전 장면</button>
  <button class="btn" id="next">다음 장면 ▶</button>
  <button class="btn" id="again">이 장면 다시 보기</button>
  <label class="speed" for="speed">재생 속도 <input type="range" id="speed" min="1.5" max="2.5" step="0.25" value="2"><b id="speedVal">2배</b></label>
  <span class="pg" id="pg"></span><button class="btn" id="theme" type="button"></button>
</div></div>

<script id="data" type="application/json">__DATA__</script>
<script>
const RAW = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// flow.json 을 설명서 모양으로 바꾼다. 흐름 그림(nodes · actions)은 그리지 않고, 데이터 출처만 구역에서 뽑는다
const SRC_ZONES = ['winus', 'fund', 'external'];
document.getElementById('manualTitle').textContent = document.title;
const tour = (RAW.tour || []).map(t => ({title: t.name, overview: true, auto: false, tips: [], img: t.img, unavailable: t.unavailable,
  // 표는 번호 순서로 놓고, 위치를 찾지 못해 번호가 없는 항목은 뒤에 둔다
  areas: (t.areas || []).map(a => ({name: a.name, m: a.meaning, no: a.no, r: a.rect})).sort((x, y) => (x.no || 1e9) - (y.no || 1e9))}));
const D = {features: [
  ...(tour.length ? [{name: '화면 둘러보기', overviewGroup: true, summary: '화면의 각 칸이 무엇을 뜻하는지 보입니다.', prereq: null, sources: [], scenes: tour}] : []),
  ...RAW.features.map(f => ({name: f.name, summary: f.summary, prereq: f.prereq || null,
    sources: [...new Set((f.nodes || []).filter(n => SRC_ZONES.includes(n.zone)).map(n => n.name))],
    scenes: f.chatbot ? [{title: '챗봇 기능 안내는 개발 중입니다', chatbot: true, tips: []}]
      : (f.scenes || []).map(s => ({title: s.title, auto: !!s.auto, tips: s.tips || [], screen: s.screen || {},
          img0: (s.screen || {}).startImg || f.screenImg,
          // 동작 이미지의 캡션은 같은 사람 동작 번호(step)를 단 흐름 동작의 글이다
          caps: Object.fromEntries((s.actions || []).filter(a => a.step).map(a => [a.step, a.text]))}))})),
]};
const W0 = 1440, H0 = 1000, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
// 재생 속도는 1.5 ~ 2.5 배이고 기본은 2 배다. 기억된 값이 이 범위 밖이면 기본으로 돌아간다
let SPEED = 2;
try { const v = +localStorage.getItem('manual-speed'); if (v >= 1.5 && v <= 2.5) SPEED = v; } catch (e) {}
const T = ms => reduce ? 0 : ms / SPEED;
const wait = ms => new Promise(r => setTimeout(r, T(ms)));
let fi = 0, si = 0, run = 0, auto = false;
// 설명서 맨 위의 「화면 둘러보기」 묶음은 0번이고, 기능은 1번부터 센다
const fno = a => D.features[0].overviewGroup ? a : a + 1;
// 화면 전체 배율: 개발자용 안내 화면과 같이 창 폭 1920 에서 0.8 배가 되도록 창 폭에 맞춘다
function fitPage() {
  const z = Math.max(0.6, Math.min(1, window.innerWidth / 2400));
  document.documentElement.style.zoom = z;
  document.documentElement.style.setProperty('--z', z);
}
fitPage();

(() => {
  const el = document.getElementById('speed'), out = document.getElementById('speedVal');
  const show = () => out.textContent = SPEED + '배';
  el.value = SPEED; show();
  el.oninput = () => { SPEED = +el.value; show(); try { localStorage.setItem('manual-speed', SPEED); } catch (e) {} };
})();

// 왼쪽 목록. 기능 머리를 누르면 그 기능의 장면을 펼치거나 접고, 재생이 다른 기능으로 넘어가면 그 기능만 펼친다
document.getElementById('feats').innerHTML = D.features.map((f, a) =>
  `<div class="feat"><button class="fh" type="button" data-g="${a}"><span class="chev"></span><span>${fno(a)}. ${esc(f.name)}</span></button><div class="fb" data-g="${a}">` + f.scenes.map((s, b) =>
    `<button class="sc" data-f="${a}" data-s="${b}"><span class="no">${b + 1}</span><span>${esc(s.title)}${s.auto ? '<span class="badge">자동</span>' : ''}</span></button>`).join('') + '</div></div>').join('');
const open = new Set();
let openedFor = -1;
function showOpen() {
  document.querySelectorAll('.feat .fh').forEach(el => {
    const o = open.has(+el.dataset.g);
    el.setAttribute('aria-expanded', o); el.querySelector('.chev').textContent = o ? '▾' : '▸';
  });
  document.querySelectorAll('.feat .fb').forEach(el => el.hidden = !open.has(+el.dataset.g));
}
function openCurrent(a) {
  if (openedFor === a) return;
  openedFor = a; open.clear(); open.add(a); showOpen();
}
document.querySelectorAll('.feat .fh').forEach(el => el.onclick = () => {
  const g = +el.dataset.g; open.has(g) ? open.delete(g) : open.add(g); showOpen();
});
document.querySelectorAll('.feat .sc').forEach(el => el.onclick = () => { setAuto(false); play(+el.dataset.f, +el.dataset.s); });
showOpen();

// 캡처 위 카메라: rect 로 줌하고, 화면이 바뀌면 앞 화면을 겹쳐 두고 줌하는 동안 지운다
function camera(rect, src, instant) {
  const view = document.getElementById('view'), layer = document.getElementById('layer'), img = document.getElementById('img'), mark = document.getElementById('mark');
  const W = view.clientWidth, H = view.clientHeight, pad = 30;
  const [x, y, w, h] = rect || [0, 0, W0, H0];
  const k = rect ? Math.min(W / (w + pad * 2), H / (h + pad * 2), 1.6) : Math.min(W / W0, H / H0);
  const ox = (W - w * k) / 2 - x * k, oy = (H - h * k) / 2 - y * k;
  const ease = `all ${instant ? 0 : T(1800) / 1000}s cubic-bezier(.4,0,.2,1)`, to = `translate(${ox}px,${oy}px) scale(${k})`;
  if (src && !img.src.endsWith(src)) {
    view.querySelectorAll('.layer.old').forEach(o => o.remove());
    if (img.getAttribute('src')) {
      const old = layer.cloneNode(true); old.classList.add('old'); old.removeAttribute('id'); layer.after(old);
      requestAnimationFrame(() => { old.style.transition = ease; old.style.transform = to; old.style.opacity = 0; });
      setTimeout(() => old.remove(), T(1900));
    }
    img.src = src;
  }
  layer.style.transition = mark.style.transition = ease;
  layer.style.transform = to;
  Object.assign(mark.style, {left: (x * k + ox) + 'px', top: (y * k + oy) + 'px', width: w * k + 'px', height: h * k + 'px', opacity: rect ? 1 : 0});
  mark.innerHTML = '';
}
function cap(text, color) {
  document.getElementById('capText').textContent = text;
  document.getElementById('capDot').style.background = color;
}

function side(f, s) {
  document.getElementById('how').textContent = f.summary;
  document.getElementById('src').innerHTML = f.sources.length ? '데이터 출처 ' + f.sources.map(n => `<span class="chip">${esc(n)}</span>`).join('') : '';
  if (s.overview) {
    document.getElementById('knowTitle').textContent = '화면 항목';
    document.getElementById('tips').innerHTML = `<table class="areas"><tbody>${s.areas.map((a, i) =>
      `<tr data-n="${a.no || ''}"><td><span class="n">${a.no || '–'}</span></td><td><b>${esc(a.name)}</b><span>${esc(a.m)}</span></td></tr>`).join('')}</tbody></table>`;
    return;
  }
  document.getElementById('knowTitle').textContent = '알아 둘 점';
  const core = s.tips.filter(t => t.level === 'core' && !t.defect), ref = s.tips.filter(t => t.level !== 'core' && !t.defect);
  const li = t => `<li>${esc(t.text)}${t.irreversible ? '<span class="irr">실행 후 되돌아가기 불가</span>' : ''}</li>`;
  document.getElementById('tips').innerHTML =
    (core.length ? `<ul class="tips">${core.map(li).join('')}</ul>` : '<p class="none">이 장면에는 따로 알아 둘 점이 없습니다.</p>') +
    (ref.length ? `<h4 class="refh">참고</h4><ul class="refs">${ref.map(li).join('')}</ul>` : '');
}

async function play(a, b) {
  const my = ++run; fi = a; si = b;
  const f = D.features[a], s = f.scenes[b], sc = s.screen || {};
  openCurrent(a);
  document.querySelectorAll('.feat .sc').forEach(el => el.classList.toggle('on', +el.dataset.f === a && +el.dataset.s === b));
  document.getElementById('kicker').textContent = `${fno(a)}. ${f.name} · ${s.overview ? '화면' : '장면'} ${b + 1} / ${f.scenes.length}`;
  document.getElementById('scene').innerHTML = esc(s.title) + (s.auto ? '<span class="badge">자동</span>' : '');
  document.getElementById('pg').textContent = `${fno(a)}. ${f.name}`;
  const pre = document.getElementById('pre');
  pre.hidden = !(b === 0 && f.prereq);
  pre.innerHTML = pre.hidden ? '' : `<b>먼저 할 일</b>${esc(f.prereq)}`;
  side(f, s);
  document.getElementById('pins').innerHTML = '';
  const shotBox = document.querySelector('.shot'), view = document.getElementById('view');
  view.querySelectorAll('.wait').forEach(w => w.remove());
  shotBox.hidden = !!s.chatbot;
  if (s.chatbot) {  // 챗봇 기능은 장면 없이 안내만 보인다
    await wait(3000); if (my !== run) return;
    if (auto) next();
    return;
  }
  if (s.overview && s.unavailable) {  // 둘러보기 화면을 캡처하지 못했으면 이유를 보이고 넘어간다
    view.insertAdjacentHTML('beforeend', `<div class="wait">${esc(s.unavailable)}</div>`);
    cap('화면 전체', '#5B6C8C');
    await wait(6000); if (my !== run) return;
    if (auto) next();
    return;
  }

  if (s.overview) {  // 0번 장면: 움직이지 않는다. 처음에는 번호를 숨기고, 표의 줄에 마우스를 올리거나 누르면 그 항목의 번호와 칸만 보인다
    camera(null, s.img, true); cap('화면 전체 · 표의 줄을 누르거나 마우스를 올리면 그 칸이 표시됩니다', '#5B6C8C');
    // 화면 가장자리의 칸은 번호가 캡처 칸 밖으로 잘리지 않게 안쪽으로 들인다
    document.getElementById('pins').innerHTML = s.areas.filter(ar => ar.no && ar.r).map(ar =>
      `<div class="pinbox" data-n="${ar.no}" style="left:${ar.r[0]}px;top:${ar.r[1]}px;width:${ar.r[2]}px;height:${ar.r[3]}px"></div>` +
      `<div class="pinx" data-n="${ar.no}" style="left:${Math.max(30, ar.r[0])}px;top:${Math.max(30, ar.r[1])}px">${ar.no}</div>`).join('');
    let sel = null;  // 누른 줄은 다른 줄을 누를 때까지 표시를 유지한다
    const show = n => document.querySelectorAll('#pins [data-n]').forEach(el => el.classList.toggle('on', el.dataset.n === n));
    document.querySelectorAll('.areas tr').forEach(tr => {
      tr.onmouseenter = () => { tr.classList.add('on'); show(tr.dataset.n); };
      tr.onmouseleave = () => { tr.classList.remove('on'); show(sel); };
      tr.onclick = () => {
        sel = sel === tr.dataset.n ? null : tr.dataset.n;
        document.querySelectorAll('.areas tr').forEach(r => r.classList.toggle('sel', r.dataset.n === sel && !!sel));
        show(sel);
      };
    });
    // 둘러보기는 읽는 화면이라 재생 속도와 상관없이 6초 보여 준다
    await new Promise(r => setTimeout(r, 6000)); if (my !== run) return;
    if (auto) next();
    return;
  }

  if (sc.endImg) new Image().src = sc.endImg;
  camera(null, s.img0 || sc.endImg, true); cap('전체 화면', '#5B6C8C');
  await wait(900); if (my !== run) return;
  if (sc.start) {
    camera(sc.start); cap(sc.startName || '누르는 곳', '#27457D');
    await wait(2000); if (my !== run) return;
    if (sc.typed) {
      const t = document.createElement('span'); t.className = 'typed';
      t.style.fontSize = Math.max(12, Math.min(22, document.getElementById('mark').clientHeight * .5)) + 'px';
      document.getElementById('mark').appendChild(t);
      for (const ch of sc.typed) { if (my !== run) return; t.textContent += ch; await wait(180); }
      await wait(700); if (my !== run) return;
    }
  } else { cap('사람이 누르지 않고 이어서 처리됩니다', '#5B6C8C'); await wait(900); if (my !== run) return; }
  // 사람 동작마다 찍은 동작 이미지를 시작과 결과 사이에 차례로 보인다
  for (const [i, fr] of (sc.frames || []).entries()) {
    camera(fr.rect || null, fr.img); cap(s.caps[i + 1] || '', '#27457D');
    await wait(1800); if (my !== run) return;
  }
  camera(sc.end || null, sc.endImg); cap(sc.endName || '결과 화면', '#B5446E');
  await wait(3200); if (my !== run) return;
  if (auto) next();
}
function next() {
  const f = D.features[fi];
  if (si < f.scenes.length - 1) play(fi, si + 1);
  else if (fi < D.features.length - 1) play(fi + 1, 0);
  else setAuto(false);
}
function prev() {
  if (si > 0) play(fi, si - 1);
  else if (fi > 0) play(fi - 1, D.features[fi - 1].scenes.length - 1);
}
function setAuto(on) { auto = on; document.getElementById('all').textContent = on ? '■ 전체 재생 멈춤' : '▶ 전체 재생'; }
document.getElementById('all').onclick = () => { if (auto) { setAuto(false); run++; } else { setAuto(true); play(fi, si); } };
document.getElementById('next').onclick = () => next();
document.getElementById('prev').onclick = () => prev();
document.getElementById('again').onclick = () => play(fi, si);
addEventListener('resize', () => { fitPage(); play(fi, si); });
// 구분선을 끌면 캡처 칸의 폭 비율(30 ~ 80%)이 바뀌고, 고른 비율은 이 브라우저에 기억해 둔다
(() => {
  const sp = document.getElementById('split'), row = document.querySelector('.row');
  const set = f => {
    f = Math.min(0.8, Math.max(0.3, f));
    row.style.setProperty('--lf', f + 'fr'); row.style.setProperty('--rf', (1 - f) + 'fr');
    return f;
  };
  try { const f = +localStorage.getItem('manual-split'); if (f) set(f); } catch (e) {}
  sp.onmousedown = e => {
    e.preventDefault();
    sp.classList.add('drag');
    let f;
    const move = ev => { const r = row.getBoundingClientRect(); f = set((ev.clientX - r.left) / r.width); };
    const up = () => {
      sp.classList.remove('drag');
      removeEventListener('mousemove', move); removeEventListener('mouseup', up);
      try { if (f) localStorage.setItem('manual-split', f); } catch (e) {}
      play(fi, si);
    };
    addEventListener('mousemove', move); addEventListener('mouseup', up);
  };
})();
play(0, 0);
// 낮 · 밤 전환. 고른 값은 이 브라우저에만 기억하고, 고르지 않았으면 브라우저 설정을 따른다
const themeBtn = document.getElementById('theme');
function isDark() { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function showTheme() { themeBtn.textContent = isDark() ? '☀ 낮' : '☾ 밤'; }
try { const t = localStorage.getItem('flow-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
themeBtn.onclick = () => { const t = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem('flow-theme', t); } catch (e) {} showTheme(); };
showTheme();
// 목록 접기. 고른 상태는 브라우저에 기억한다(개발자용 화면 틀과 같은 키)
const foldBtn = document.getElementById('fold'), appEl = document.querySelector('.app');
function showFold() { foldBtn.textContent = appEl.classList.contains('folded') ? '▶ 목록 펼치기' : '◀ 목록 접기'; }
try { if (localStorage.getItem('flow-rail') === 'folded') appEl.classList.add('folded'); } catch (e) {}
foldBtn.onclick = () => { appEl.classList.toggle('folded'); try { localStorage.setItem('flow-rail', appEl.classList.contains('folded') ? 'folded' : 'open'); } catch (e) {} showFold(); };
showFold();
</script>
