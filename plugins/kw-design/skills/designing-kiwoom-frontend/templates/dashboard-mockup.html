    <script>
      /* 템플릿 index.html 의 셸 스크립트와 같다. 첫 페인트 전에 낮/밤과 사이드바 접힘을 건다 */
      (function () {
        var root = document.documentElement;
        var theme = null;
        var rail = null;
        try {
          theme = localStorage.getItem('kw-division-dashboard-theme');
          rail = localStorage.getItem('kw-division-dashboard-rail');
        } catch (e) {}
        var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        root.setAttribute('data-theme', theme === 'light' || theme === 'dark' ? theme : sysDark ? 'dark' : 'light');
        if (rail === 'collapsed') root.setAttribute('data-rail', 'collapsed');
      })();
    </script>

           { "name", "locked": true }, 카테고리는 { "cat", "items": [ … ] } 다. 대표 기능 하나가 "/" 다.
           이름 오른쪽에 숫자나 짧은 글자를 붙이려면 줄에 "marker": "3" 을 적는다. 카테고리 이름을 누르면 그 안의 첫 기능으로 간다.
           하위 기능이 필요하면 기능 줄을 { "name", "items": [ … ] } 로 적는다(카테고리 안에도 둘 수 있다). 쓰지 않아도 된다.
         · <template data-path="…"> 하나가 화면 하나다. 내용 구획에 들어갈 HTML 만 적는다.
           data-title 은 상태바 제목(없으면 메뉴 이름), data-asof 는 기준 시각이다.
           내용 정렬은 자유롭게 정한다. 제안값은 중앙이고, data-align="left" 나 "right" 로 바꾼다.
         · <template id="alerts" data-count="…"> 는 상태바 종을 누르면 열리는 알림 서랍 내용이다.
         · 사이드바와 상태바는 그리지 않는다. 아래 스크립트가 실제 셸 코드로 그린다. -->
    <script type="application/json" id="mockup-config">
      {
        "org": "OO본부",
        "menu": [
          { "name": "기능 1", "path": "/" },
          { "name": "기능 2", "path": "/feature-2" }
        ]
      }
    </script>

    <template data-path="/">
      <p class="lede">여기에 화면 내용을 적습니다. 카드 · 단추 · 입력칸은 공용 컴포넌트 클래스(kw-card · kw-btn · kw-input)를 쓰고, 표는 div.table-box 안에 table 을 넣으면 목업 스타일에 정해 둔 모양이 됩니다.</p>
    </template>

    <template data-path="/feature-2">
      <p class="lede">두 번째 화면입니다.</p>
    </template>

    <template id="alerts" data-count="0">
      <p style="padding: 0 16px; color: var(--text-tertiary)">알림이 없습니다.</p>
    </template>
    <!-- ════ 목업 내용 끝 ════ -->
