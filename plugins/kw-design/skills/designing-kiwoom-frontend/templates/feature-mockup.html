<!doctype html>
<!-- 일반 기능 화면 목업 템플릿. 이 파일을 복사해 쓰고, 표시된 구간(목업 스타일 · 목업 내용)만 고친다.
     토큰이 이 파일 안에 있어 HTML 파일 하나로 열린다. 서체는 사내 PC 기본 서체인 맑은 고딕이다. -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>기능 화면 목업</title>
    <script>
      (function () {
        var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', sysDark ? 'dark' : 'light');
      })();
    </script>
    <style id="kw-tokens">
/* ══════════════════════════════════════════════════════════════════════
   대시보드 토큰 — 셸 파일이다. 대시보드를 만들면서 고치지 않는다.

   값은 2026-09-30 에 낮과 밤을 화면으로 대조해 정한 것이다. 두 층으로 둔다.
     · :root 블록 — 값을 가진 원시 층. 셸 CSS 가 var(--bg-rail) 처럼 직접 쓴다.
     · 맨 끝 @theme — Tailwind 유틸리티 이름을 붙이는 층. 내용 구획은 이 이름을 쓴다
       (bg-surface · text-on-surface · border-outline · text-rise …).

   낮/밤: 기본은 OS 설정을 따르고, 사이드바 하단 설정 판에서 고르면 <html data-theme> 로
   덮어쓴다. 셸 강조(--brand)가 무채색이라 사이드바와 상태바는 두 테마가 서로 뒤집힌 값을
   쓰고, 내용 구획 강조(--accent)는 슬레이트 남색으로 따로 둔다.
   ══════════════════════════════════════════════════════════════════════ */

/* ── 낮 (기본) ─────────────────────────────────────────────── */
:root {
  /* 셸 강조 — 사이드바와 상태바가 쓴다. 내용 구획은 --accent 를 쓴다 */
  --brand: #1A1A1A;
  --brand-fill: #1A1A1A;
  --brand-fill-hover: #33353A;
  --on-brand: #FFFFFF;
  /* 포커스 링. 키보드로 어디 있는지 알리는 표시라 선택 면(--sel-weak)보다 진하다 */
  --brand-weak: rgba(0, 0, 0, .055);
  /* 「고른 것」에 까는 면. 선택은 굵은 글자가 함께 말하므로 면은 옅게 둔다 */
  --sel-weak: rgba(0, 0, 0, .034);
  /* 사이드바 안의 호버 면. 불투명 회색(--bg-hover)을 쓰면 사이드바 그라데이션을 덮고,
     선택 면보다 진해져 지나가는 항목이 보고 있는 항목보다 도드라진다 */
  --hover-weak: rgba(0, 0, 0, .014);
  /* 프로필 아바타 — 누구나 같은 남색(CI 네이비)이고 밤에도 바뀌지 않는다 */
  --avatar-bg: #00468B;
  --on-avatar: #FFFFFF;

  /* 내용 구획 강조 — 칩 · 단추 · 달성률 막대 · 진행 중 표시가 쓴다.
     옅은 면(--accent-weak)은 이 색을 흰 면에 12% 섞은 고정값이다 */
  --accent: #3F5A80;
  --on-accent: #FFFFFF;
  --accent-weak: #E8EBF0;
  /* 커서가 올라왔을 때와 누르고 있는 동안. 더 강조하는 것이 아니라 어디에 있는지 알리는
     되먹임이라, 바탕에서 또렷해지는 쪽으로 간다 — 낮은 어두워지고 밤은 밝아진다 */
  --accent-hover: #35496A;
  --accent-active: #2C3D58;

  /* 그래프 선 — 겹치지 않는 차트(도넛 · 단일 막대)는 1·2순위와 회색 셋만 쓴다.
     3순위 이상은 겹치는 차트에만 쓰고, 넷을 넘으면 색을 더 만들지 않는다 */
  --chart-1: #3F5A80;
  --chart-2: #009E98;
  --chart-3: #8E44AD;
  --chart-4: #B0453F;
  --chart-gray-1: #7C8DA7;
  --chart-gray-2: #9FAEC3;
  --chart-gray-3: #C5CFDC;
  /* 막대 위를 지나는 선처럼 겹쳐 그릴 때의 2순위. 낮은 흰 카드라 밝히면 선이 사라지므로
     2순위를 그대로 쓰고, 밤은 어두운 카드라 흰색으로 띄운다 */
  --chart-2-over: var(--chart-2);

  --bg-app: #FFFFFF;
  /* 사이드바 바탕. 단색으로 둔다 — 스크롤바 썸이 이 값을 border 에 쓰는데 border 에는
     그라데이션을 넣을 수 없다. 면에 까는 한기는 --rail-tint 가 따로 맡는다 */
  --bg-rail: #FAFAFA;
  /* CI 네이비에서 뽑은 아주 옅은 한기. 위에서 시작해 절반쯤에서 무채색으로 풀린다 */
  --rail-tint: linear-gradient(180deg, #F1F5FB 0%, #FAFAFA 52%, #FAFAFA 100%);
  --bg-surface: #FFFFFF;
  --bg-sunken: #F4F6FA;
  --bg-hover: #EFF1F4;
  /* 대화상자 면. 밤에는 뒤에 깔린 카드와 갈라져야 해서 카드보다 한 단 밝다 */
  --bg-dialog: #FFFFFF;
  /* 표에서 고른 행. 굵은 글씨가 함께 말한다 */
  --row-sel: #EFF1F4;
  --scrim: rgba(0, 0, 0, .40);

  --text-primary: #1A1A1A;
  --text-secondary: #5D5D5D;
  --text-tertiary: #6E6E6E;
  --link: #2A5FA0;
  --link-hover: var(--accent);
  --focus: #2A5FA0;
  --disabled: #8E8E8E;

  --border-light: #E5E5E5;
  --border-medium: #D1D1D1;

  /* 표 머리 — 낮은 옅은 하늘 면에 검은 글자를 얹는다. 강조색 면은 표가 여럿인 화면에서
     머리 띠가 너무 세게 보여 뺐다. 고른 행(#EFF1F4)과는 OKLab 거리 4.1 로 떨어뜨렸다 —
     옅은 강조(#E8EBF0)는 거리가 1.8 이라 고른 행과 같은 색으로 보인다.
     밤에는 흰 글자가 대비 2.59 밖에 안 나와 채도를 한 단 내린 면에 어두운 글자를 둔다 */
  --th-bg: #DDE5F2;
  --th-ink: #1A1A1A;

  /* 상태 3색. 초록과 노랑은 쓰지 않는다 — 흰 면에서 맑은 노랑은 대비가 2.2 까지
     떨어지고, 초록은 낮 3.09 대 밤 10.2 로 두 테마의 무게가 어긋난다.
       ok   = 진행 중(접수중). 면 없이 보통 굵기로 둔다
       warn = 확인 필요(검수필요). 굵은 글씨에 옅은 면을 준다
       bad  = 마감 알림(마감임박 · D-n). 굵은 글씨에 옅은 면을 준다 */
  /* 진행 중은 강조색과 같다. 강조색을 바꾸면 함께 바뀐다. 밤 값은 --accent 가 밤 값으로
     바뀌면서 따라온다 */
  --ok: var(--accent);
  --ok-weak: var(--accent-weak);
  --warn: #E98B33;
  --warn-weak: #FCEFE2;
  --warn-fill: #FFC98A;
  --warn-ink: #4F2800;
  --warn-text: #F26A00;
  --bad: #E5202B;
  --bad-weak: #F9E7E7;
  --bad-fill: #FFB3AE;
  --bad-ink: #6B0F12;
  /* 마감 알림 면 위의 글자(알림 종 건수 배지). 밤의 --bad 는 밝아 흰 글자가 묻히므로 밤에는 어둡게 둔다 */
  --on-bad: #FFFFFF;

  /* 등락 — 국내 주식 관행대로 상승이 붉은 계열, 하락이 푸른 계열이다.
     자금 유입과 유출도 등락이므로 같은 값을 쓴다.
     글자는 --rise · --fall 을 쓰고, 흰 글자를 얹는 면과 도형은 --rise-fill · --fall-fill 을
     쓴다. 밤에는 면 위에 흰 글자를 얹지 않으므로 둘이 같은 값이다 */
  --rise: #E5202B;
  --fall: #2A5FA0;
  --rise-fill: #B0453F;
  --fall-fill: #3F6FA8;
  --rise-weak: #F9E7E7;
  --fall-weak: #E4EBF4;

  --grid-line: #EDEDED;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-full: 9999px;
  /* 표와 오른쪽 상세 패널의 모서리. Tailwind 의 rounded-lg · rounded-xl 을 바꾸면 이미 쓰는 화면이
     달라지고 크기 순서도 뒤집히므로 이름을 따로 둔다 */
  --table-radius: 12px;
  --panel-radius: 18px;

  /* 키보드로 어디에 있는지 알리는 표시. 두께와 간격을 화면마다 다르게 적지 않는다 */
  --focus-width: 2px;
  --focus-offset: 1px;

  --elev-sm: 0 1px 3px rgba(0, 0, 0, .08);
  --elev-md: 0 6px 18px rgba(0, 0, 0, .14);

  /* 겹치는 차례. 숫자를 코드에 직접 적지 않는다.
     modal 은 페이지가 대화상자를 만들 때 쓴다 */
  --z-topbar: 20;
  --z-popover: 60;
  --z-modal: 80;

  /* 굵기는 맑은 고딕의 보통과 굵게 두 가지만 쓴다. 300 · 500 · 600 은 이름을 두지 않는다 */
  --w-regular: 400;
  --w-bold: 700;

  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px;
  /* 표 칸 여백처럼 위 단계 사이의 값 */
  --sp-12: 12px; --sp-20: 20px;

  /* 글자 크기. 쓰임은 kw-design 스킬의 글자 크기 표를 따른다 */
  --fs-metric: 17px; --fs-body: 14px; --fs-sub: 13px; --fs-label: 12px; --fs-badge: 11px; --fs-note: 10px;

  --rail-w: 238px;
  /* 사이드바 머리 칸과 상태바의 높이. 둘은 따로 정한다 */
  --head-h: 61px;
  --topbar-h: 50px;
  --t-fast: .15s ease;

  --lead-tight: 1.2; --lead-snug: 1.5; --lead-relaxed: 1.6;
}

/* ── 밤 : OS 설정을 따르는 때 ──────────────────────────────── */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #ECEEF1;
    --brand-fill: #ECEEF1;
    --brand-fill-hover: #FFFFFF;
    --on-brand: #14161A;
    --brand-weak: rgba(255, 255, 255, .09);
    --sel-weak: rgba(255, 255, 255, .054);
    --hover-weak: rgba(255, 255, 255, .026);

    --accent: #7FA3D6;
    --on-accent: #12161C;
    --accent-weak: #232932;
    --accent-hover: #93B2DF;
    --accent-active: #A6C0E6;

    --chart-1: #2E7DEA;
    --chart-2: #17A79F;
    --chart-3: #9463D9;
    --chart-4: #C6635E;
    --chart-gray-1: #B0B5BA;
    --chart-gray-2: #7E848A;
    --chart-gray-3: #4E5359;
    --chart-2-over: #FFFFFF;

    --bg-app: #0F1013;
    --bg-rail: #121418;
    /* 밤에는 그라데이션을 쓰지 않는다. 사이드바가 본문보다 이미 밝아 경계가 서 있고,
       어두운 바탕에 한기를 얹으면 면이 탁해진다. 변수를 지우지 않고 none 으로 둔다 */
    --rail-tint: none;
    --bg-surface: #16181C;
    --bg-sunken: #282C35;
    --bg-hover: #2A2F38;
    --bg-dialog: #20242B;
    --row-sel: #26303F;
    --scrim: rgba(0, 0, 0, .70);

    --text-primary: #F2F4F7;
    --text-secondary: #A8B0BC;
    --text-tertiary: #98A0AC;
    --link: #6FB0FF;
    --focus: #6FB0FF;
    --disabled: #7C8490;

    --border-light: #2A2E35;
    --border-medium: #3A414A;

    --th-bg: #7C9BC4;
    --th-ink: #12161C;

    --warn: #E08A4E;
    --warn-weak: #2E2622;
    --warn-fill: #FFC07A;
    --warn-ink: #3D2000;
    --warn-text: #FF9A4D;
    --bad: #FF5A50;
    --bad-weak: #322426;
    --bad-fill: #FF9C94;
    --bad-ink: #4A0B0E;
    --on-bad: #12161C;

    --rise: #FF5A50;
    --fall: #6FB0FF;
    --rise-fill: #FF5A50;
    --fall-fill: #6FB0FF;
    --rise-weak: #322426;
    --fall-weak: #222B35;

    --grid-line: #262A31;

    --elev-sm: 0 1px 3px rgba(0, 0, 0, .40);
    --elev-md: 0 6px 18px rgba(0, 0, 0, .55);
  }
}

/* ── 밤 : 설정 판에서 고른 때 (미디어쿼리를 이긴다) ─────────── */
:root[data-theme="dark"] {
  --brand: #ECEEF1;
  --brand-fill: #ECEEF1;
  --brand-fill-hover: #FFFFFF;
  --on-brand: #14161A;
  --brand-weak: rgba(255, 255, 255, .09);
  --sel-weak: rgba(255, 255, 255, .054);

  --on-accent: #12161C;
  --accent-weak: #232932;
  --accent-hover: #93B2DF;
  --accent-active: #A6C0E6;

  --chart-1: #2E7DEA;
  --chart-2: #17A79F;
  --chart-3: #9463D9;
  --chart-4: #C6635E;
  --chart-gray-1: #B0B5BA;
  --chart-gray-2: #7E848A;
  --chart-gray-3: #4E5359;
  --chart-2-over: #FFFFFF;

  --bg-app: #0F1013;
  --bg-rail: #121418;
  --rail-tint: none;
  --bg-surface: #16181C;
  --bg-sunken: #282C35;
  --bg-hover: #2A2F38;
  --bg-dialog: #20242B;
  --row-sel: #26303F;

  --text-primary: #F2F4F7;

/* ── 키움 색 후보 ───────────────────────────────────────────────
   기본은 위에 적은 슬레이트 계열이다. 1순위가 남색이고 2순위가 청록이다. 옛 대시보드가 쓰던
   키움 남색과 핑크는 아래에 -kiwoom 이름으로 함께 둔다. 켜는 스위치는 없다. 쓰겠다고 하면
   대시보드가 자기 CSS 파일에서 다섯 이름을 아래 토막대로 되가리킨다.

     :root,
     :root[data-theme="dark"] { --chart-1: var(--chart-1-kiwoom); --chart-2: var(--chart-2-kiwoom);
       --rise: var(--rise-kiwoom); --rise-fill: var(--rise-fill-kiwoom); --rise-weak: var(--rise-weak-kiwoom); }
     @media (prefers-color-scheme: dark) {
       :root:not([data-theme="light"]) { 같은 다섯 줄 }
     }

   선택자를 셸과 같은 모양으로 맞추는 까닭은 :root[data-theme="dark"] 가 :root 보다 점수가 높아서다.
   평범한 :root 한 블록만 적으면 낮에만 바뀌고 밤에는 셸 값이 그대로 나온다.

   후보도 테마마다 값을 보유하므로 되가리키기만 하면 낮과 밤이 함께 따라온다. 하락색과 배경과
   표 머리와 회색 셋은 두 팔레트가 같다. 상승만 팔레트를 따르므로, 한 대시보드 안에서는 상승이
   늘 한 색이다. */
:root {
  --chart-1-kiwoom: #001D52;
  --chart-2-kiwoom: #E8196C;
  --rise-kiwoom: #E8196C;
  /* 흰 글자를 얹는 면이라 상승색보다 어둡다 — #E8196C 는 흰 글자 대비가 4.39 뿐이다 */
  --rise-fill-kiwoom: #C9185C;
  --rise-weak-kiwoom: #FCE3ED;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chart-1-kiwoom: #608CD1;
    --chart-2-kiwoom: #F64A93;
    --rise-kiwoom: #F64A93;
    --rise-fill-kiwoom: #F64A93;
    --rise-weak-kiwoom: #311E2A;
  }
}

:root[data-theme="dark"] {
  --chart-1-kiwoom: #608CD1;
  --chart-2-kiwoom: #F64A93;
  --rise-kiwoom: #F64A93;
  --rise-fill-kiwoom: #F64A93;
  --rise-weak-kiwoom: #311E2A;
}

/* ── Tailwind 유틸리티 이름 ─────────────────────────────────────
   inline 이라 유틸리티가 var(--bg-surface) 를 그대로 심는다. 그래서 낮/밤이 바뀌면
   유틸리티 색도 함께 바뀐다. Tailwind 기본 색(red-500 등)은 지우지 않는다 —
   내용 구획의 색 규칙은 권장이고, 권장은 스킬이 말한다. */
@theme inline {
  --color-brand: var(--brand);
  --color-on-brand: var(--on-brand);

  --color-accent: var(--accent);
  --color-on-accent: var(--on-accent);
  --color-accent-weak: var(--accent-weak);

    </style>
    <style id="kw-base">
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg-app);
        color: var(--text-primary);
        font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        font-size: 14px;
        line-height: var(--lead-relaxed);
        font-variant-numeric: tabular-nums;
      }
      .theme-toggle {
        position: fixed; top: 12px; right: 16px; height: 30px; padding: 0 12px;
        border: 1px solid var(--border-light); border-radius: var(--radius-sm);
        background: var(--bg-surface); color: var(--text-secondary); font: inherit; font-size: 13px; cursor: pointer;
      }
    </style>
    <style id="kw-ui">
/* 공용 컴포넌트의 모양. Tailwind 가 없는 화면에서도 동작한다. */
/* 레이어 순서를 먼저 정한다. 이 파일을 Tailwind 보다 먼저 불러와도 Tailwind 의 기본 초기화가
   단추 모양을 덮지 않게 하기 위해서다. Tailwind 가 없는 화면은 태그 이름 규칙을 전역 CSS 에 적지 않는다. */
@layer theme, base, components, utilities;

@layer components {
  .kw-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-xs);
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    font: inherit;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color .12s;
  }
  .kw-btn--md { height: 36px; padding: 0 14px; font-size: var(--fs-body); }
  .kw-btn--sm { height: 30px; padding: 0 var(--sp-sm); font-size: var(--fs-label); }
  .kw-btn--primary { background: var(--accent); color: var(--on-accent); }
  .kw-btn--primary:hover:not(:disabled) { background: var(--accent-hover); }
  .kw-btn--outline { background: transparent; border-color: var(--border-medium); color: var(--text-primary); }
  .kw-btn--ghost { background: transparent; color: var(--text-secondary); }
  .kw-btn--outline:hover:not(:disabled),
  .kw-btn--ghost:hover:not(:disabled) { background: var(--bg-hover); }
  .kw-btn:disabled { color: var(--disabled); border-color: var(--border-light); cursor: not-allowed; }

  .kw-input {
    width: 100%;
    height: 36px;
    padding: 0 14px;
    border: 1px solid var(--border-medium);
    border-radius: var(--radius-sm);
    background: var(--bg-surface);
    color: var(--text-primary);
    font: inherit;
    font-size: var(--fs-body);
  }
  .kw-input[aria-invalid='true'] { border-color: var(--bad); }
  .kw-input:disabled { background: var(--bg-sunken); color: var(--disabled); cursor: not-allowed; }

  .kw-btn:focus-visible,
  .kw-input:focus-visible,
  .kw-modal__close:focus-visible {
    outline: var(--focus-width) solid var(--focus);
    outline-offset: var(--focus-offset);
  }

  .kw-card {
    padding: var(--sp-md);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    background: var(--bg-surface);
  }
  .kw-card__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--sp-12);
  }
  .kw-card__actions { margin-left: auto; }
  .kw-card__title { margin: 0; font-size: var(--fs-body); font-weight: var(--w-bold); }

  .kw-modal {
    width: min(calc(100vw - var(--sp-xl)), 400px);
    padding: var(--sp-md) var(--sp-20);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    background: var(--bg-dialog);
    color: var(--text-primary);
    box-shadow: var(--elev-md);
  }
  .kw-modal::backdrop { background: var(--scrim); }
  .kw-modal__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--sp-12);
  }
  .kw-modal__title { margin: 0; font-size: var(--fs-body); font-weight: var(--w-bold); }
  .kw-modal__close {
    display: inline-flex;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .kw-modal__body { font-size: var(--fs-body); }
  .kw-modal__foot {
    display: flex;
    justify-content: flex-end;
    gap: var(--sp-sm);
    margin-top: var(--sp-md);
  }
}
    </style>
    <!-- ════ 여기부터 목업 스타일이다. 고쳐도 된다 ════
         · Tailwind 클래스는 이 파일에서 동작하지 않는다. CSS 와 토큰 변수만 쓴다.
         · 색 · 모서리 · 간격은 토큰 변수로 쓴다: var(--bg-surface) · var(--text-secondary) ·
           var(--border-light) · var(--radius-md) · var(--table-radius) · var(--sp-md) 같은 이름이다.
         · 선택자는 .content 아래로 묶는다. 내용 정렬은 자유롭게 정한다. 제안값은 중앙이다. -->
    <style id="mockup-style">
      .content { max-width: 1404px; margin-inline: auto; padding: var(--sp-lg) var(--sp-xl) 64px; }
      .content .lede { margin: 0 0 var(--sp-md); font-size: 13px; color: var(--text-secondary); }
      .content .table-box { padding: var(--sp-sm) 20px; border: 1px solid var(--border-light); border-radius: var(--table-radius); background: var(--bg-surface); }
      .content table { width: 100%; border-collapse: separate; border-spacing: 0; }
      .content th { text-align: left; font-size: 12px; font-weight: var(--w-bold); padding: 8px 16px; color: var(--text-secondary); background: var(--bg-surface); border-bottom: 1px solid var(--border-medium); }
      .content td { font-size: 14px; padding: 10px 16px; border-bottom: 1px solid var(--border-light); }
      .content tr:last-child td { border-bottom: 0; }
    </style>
    <!-- ════ 목업 스타일 끝 ════ -->
  </head>
  <body>
    <!-- ════ 여기부터 목업 내용이다. 고쳐도 된다 ════ -->
    <main class="content">
      <p class="lede">여기에 화면 내용을 적습니다. 카드 · 단추 · 입력칸은 공용 컴포넌트 클래스(kw-card · kw-btn · kw-input)를 쓰고, 표는 div.table-box 안에 table 을 넣으면 목업 스타일에 정해 둔 모양이 됩니다.</p>
    </main>
    <!-- ════ 목업 내용 끝 ════ -->
    <button class="theme-toggle" type="button" id="theme-toggle"></button>
    <script>
      (function () {
        var root = document.documentElement;
        var btn = document.getElementById('theme-toggle');
        function label() { btn.textContent = root.getAttribute('data-theme') === 'dark' ? '낮' : '밤'; }
        btn.onclick = function () {
          root.setAttribute('data-theme', root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
          label();
        };
        label();
      })();
    </script>
  </body>
</html>
